<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>__TITLE__</title>
<!-- S7.3 okuma platformu ve ar-ge masasının birim görünümü: tek uygulama (scripts/oku-veri.py kurar). MASA kipinde
     bütün taslaklar, yan yana, kapı, eleştirmen, nisbet ve notların hayatı da görünür. -->
<style>
@font-face { font-family: "Naskh"; src: url("__FONT__") format("truetype"); font-display: swap; }
:root { --bg: #fbfaf7; --fg: #1d1d1b; --muted: #6b6a66; --line: #dcd8cf; --card: #fff; --soft: #f3f1ec;
  --accent: #1f5c3f; --ai: #5a4a8a; --ai-soft: #eeebf7; --bad: #a3271f; --src: #1f4f7a; --src-soft: #e3eef8;
  --warn-soft: #fdf0dc; --q: #f6f2e8; --tag: #b45309; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161614; --fg: #e8e6e1; --muted: #9c9a94; --line: #34332f; --card: #1f1e1b; --soft: #26251f;
  --accent: #7cc49d; --ai: #b9a8ee; --ai-soft: #2a2540; --bad: #f08a80; --src: #8cc0ef; --src-soft: #18293a;
  --warn-soft: #3a2a14; --q: #24221c; --tag: #f0a35a; } }
:root[data-theme="dark"] { --bg: #161614; --fg: #e8e6e1; --muted: #9c9a94; --line: #34332f; --card: #1f1e1b;
  --soft: #26251f; --accent: #7cc49d; --ai: #b9a8ee; --ai-soft: #2a2540; --bad: #f08a80; --src: #8cc0ef;
  --src-soft: #18293a; --warn-soft: #3a2a14; --q: #24221c; --tag: #f0a35a; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.65 system-ui, "Noto Sans", "Naskh", sans-serif; }
a { color: var(--src); }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px; padding: 8px 16px; }
header .aistamp { font-size: .72rem; color: var(--muted); white-space: nowrap; }
@media (max-width: 560px) { header .aistamp { font-size: .62rem; } }
header .t { font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header a, header button { font-size: .85rem; }
a.hbtn { border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; text-decoration: none; color: var(--fg); }
button { font: inherit; background: none; border: 1px solid var(--line); border-radius: 6px; color: inherit;
  padding: 2px 8px; cursor: pointer; }
button.on { background: var(--soft); border-color: var(--accent); }
.wrap { display: flex; }
aside { width: 230px; flex: none; border-right: 1px solid var(--line); padding: 12px; height: calc(100vh - 45px);
  position: sticky; top: 45px; overflow-y: auto; font-size: .9rem; }
aside input { width: 100%; padding: 5px 8px; font: inherit; border: 1px solid var(--line); border-radius: 6px;
  background: var(--card); color: var(--fg); }
aside select { width: 100%; margin: 8px 0; font: inherit; padding: 4px; background: var(--card); color: var(--fg);
  border: 1px solid var(--line); border-radius: 6px; }
aside ul { list-style: none; padding: 0; margin: 6px 0; }
aside li a { display: block; padding: 2px 6px; border-radius: 5px; text-decoration: none; color: var(--fg); }
aside li a.cur { background: var(--soft); font-weight: 600; }
aside li a.off { color: var(--muted); }
.dot { display: inline-block; width: 1.1em; color: var(--accent); }
main { flex: 1; min-width: 0; padding: 12px 24px 80px; }
/* platform: metin sütunu ölçülü (uzun satır zor okunur), sağda yan sütun; masa ve "geniş" kipte ekranın tamamı */
body:not(.masa):not(.wide) main { max-width: 860px; }
#side { display: none; flex: 1; min-width: 300px; max-width: 560px; border-left: 1px solid var(--line); padding: 12px 16px;
  height: calc(100vh - 45px); position: sticky; top: 45px; overflow-y: auto; font-size: .9rem; }
@media (min-width: 1200px) { body:not(.masa):not(.wide) #side { display: block; } }
body.nopanel aside#panel { display: none; }
@media (max-width: 760px) { aside#panel { display: none; position: fixed; left: 0; top: 45px; z-index: 4; background: var(--bg);
  width: 85vw; box-shadow: 2px 0 12px rgba(0,0,0,.15); } body.panelopen aside#panel { display: block; }
  main { padding: 12px 16px 80px; } }
h1 { font-size: 1.2rem; margin: 8px 0; } h2 { font-size: 1.05rem; margin: 26px 0 8px; color: var(--accent); }
h3 { font-size: .95rem; margin: 18px 0 6px; }
.muted { color: var(--muted); } .small { font-size: .82rem; }
.ar { font-family: "Naskh", "Noto Naskh Arabic", "Amiri", serif; direction: rtl; text-align: right; font-size: 1.3rem;
  line-height: 2.1; margin: 8px 0 2px; }
.tr { font-family: "Noto Serif", "Naskh", "DejaVu Serif", Georgia, serif; margin: 2px 0; }   /* Türkçe içindeki Arapça Naskh ile (Kur'ân işaretleri) */
.stamp { background: var(--warn-soft); border-radius: 8px; padding: 6px 12px; font-size: .85rem; margin: 8px 0 14px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 14px 0 10px; overflow-x: auto; }
.tabs a { padding: 6px 10px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a.on { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.blk { position: relative; margin: 4px 0 12px; }
.blk.hl { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
.lab { font-size: .72rem; color: var(--ai); }
.qline { display: block; background: var(--q); border-left: 3px solid var(--line); padding: 2px 10px; margin: 4px 0; border-radius: 4px; }
.quote { background: var(--q); border-left: 3px solid var(--line); padding: 4px 10px; border-radius: 4px; }
.ders { border-left: 3px solid var(--accent); padding: 0 0 0 12px; margin: 10px 0; }
.ders > h3 { margin-top: 6px; }
.izah { background: var(--ai-soft); border-radius: 8px; padding: 6px 10px; margin: 4px 0; font-size: .93rem; }
[data-hat] { cursor: pointer; text-decoration: underline dotted; }
.acts { font-size: .75rem; color: var(--muted); } .acts a { color: var(--muted); margin-right: 10px; cursor: pointer; }
a.n { color: var(--src); font-size: .72em; vertical-align: super; text-decoration: none; cursor: pointer; }
.mk { color: var(--src); font-size: .86em; white-space: nowrap; }
.mk a.n { font-size: 1em; vertical-align: baseline; text-decoration: underline dotted; }
.tg { color: var(--tag); font-size: .86em; }
a.n.cur { background: var(--src-soft); border-radius: 3px; }
mark { background: var(--warn-soft); color: inherit; }
.srcbox { background: var(--src-soft); border-radius: 8px; padding: 6px 10px; margin: 4px 0; font-size: .88rem; overflow-wrap: anywhere; }
.flag { background: var(--warn-soft); border-radius: 6px; padding: 3px 8px; font-size: .8rem; margin: 4px 0; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; margin: 10px 0; }
details { margin: 8px 0; } details > summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.note { border-top: 1px dashed var(--line); padding: 6px 0; font-size: .88rem; }
.tag { display: inline-block; font-size: .72rem; border: 1px solid var(--line); border-radius: 10px; padding: 0 7px;
  color: var(--muted); margin-right: 4px; }
form.nf { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 6px 0; }
form.nf textarea { width: 100%; min-height: 70px; font: inherit; background: var(--bg); color: var(--fg);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
form.nf select { font: inherit; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } .cols > div { min-width: 0; }
@media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
table.t { width: 100%; border-collapse: collapse; font-size: .85rem; } table.t td { border-top: 1px solid var(--line);
  padding: 4px 6px; vertical-align: top; }
.ok { color: var(--accent); } .bad { color: var(--bad); }
</style></head><body>
<header><button id="menu" aria-label="Kur'ân paneli" title="Kur'ân panelini aç/kapa">☰</button><span class="t" id="ttl"></span><span class="aistamp" title="Bu sayfadaki taslak, tercüme ve izahlar yapay zekânındır; tefsir değildir">yapay zekâ taslağı · tefsir değildir</span>
<button id="genis" title="Metni ekranın tamamına yay" hidden>↔ geniş</button>
<a class="hbtn" id="masaBtn" href="/taslak/" hidden>Ar-ge masası</a><a class="hbtn" href="__USUL__">Usul</a>__EXTRA__<span class="small muted" id="ben"></span></header>
<div class="wrap"><aside id="panel"></aside><main id="main"></main><aside id="side"><p class="small muted">Bir atfın numarasına tıklayınca kaynağın metni burada açılır.</p></aside></div>
<script>
const MASA = __MASA__;
const DATA = MASA ? 'birim/' : 'veri/', TDATA = MASA ? 'oku/veri/' : 'veri/', API = '/taslak/api/';
const PLAT = 'https://risalemcp.com/oku/';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const store = {get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
               set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }};
const rng = a => a[0] === a[1] ? String(a[0]) : a[0] + '–' + a[1];
let INDEX = null, U = null, NOTES = [], ME = null, VIEW = {ar: false, izah: true, hat: 'turk'};   // hat: Türk hattı varsayılan (S7e)

async function getJSON(u) { const r = await fetch(u, {cache: 'no-cache'}); if (!r.ok) throw new Error(r.status); return r.json(); }

// ---------------------------------------------------------------- Kur'ân paneli
function panel(cur) {
  const b = INDEX.birimler;
  const L = ['<input id="git" placeholder="Âyete git: 2:255" autocomplete="off">',
    '<input id="ara" placeholder="Taslaklarda ara" autocomplete="off" style="margin-top:6px">',
    '<select id="sure">' + INDEX.sureler.map(s => `<option value="${s.n}"${s.n === 2 ? ' selected' : ' disabled'}>${s.n}. ${esc(s.ad)}${s.n === 2 ? '' : ' (henüz yok)'}</option>`).join('') + '</select>',
    '<ul>'];
  for (const x of b) {
    const has = x.taslak || x.isarat || (MASA && x.masa_taslak);
    const mark = x.taslak ? '●' : (x.isarat ? '◐' : '○');
    L.push(`<li><a href="#/${esc(x.id)}" class="${x.id === cur ? 'cur' : ''} ${has ? '' : 'off'}"><span class="dot">${mark}</span>Bakara ${esc(rng(x.ayet))}</a></li>`);
  }
  L.push('</ul><p class="small muted">● taslak var · ◐ yalnız İşârât · ○ henüz yazılmadı</p>');
  L.push('<p class="small"><a href="#/~sure">Sûre boyunca kesintisiz oku</a></p>');
  $('panel').innerHTML = L.join('');
  $('git').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const m = e.target.value.trim().match(/^(?:(\d+)\s*[:.\/ ]\s*)?(\d+)$/);
    if (!m) return;
    const s = +(m[1] || 2), a = +m[2];
    if (s !== 2) { e.target.value = ''; e.target.placeholder = 'Şimdilik yalnız Bakara'; return; }
    const x = b.find(x => x.ayet[0] <= a && a <= x.ayet[1]);
    if (x) location.hash = '#/' + x.id;
  });
  $('ara').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.value.trim().length >= 3) location.hash = '#/~ara/' + encodeURIComponent(e.target.value.trim()); });
  const c = document.querySelector('aside a.cur'); if (c) c.scrollIntoView({block: 'nearest'});
}
// panel: telefonda üstte açılır, bilgisayarda yer kaplar; ikisinde de açılıp kapanır, bilgisayardaki durum hatırlanır
const narrow = () => matchMedia('(max-width: 760px)').matches;
if (MASA) document.body.classList.add('masa');
if (store.get('oku-panel') === 'kapali') document.body.classList.add('nopanel');
if (store.get('oku-genis') === '1') document.body.classList.add('wide');
$('genis').hidden = MASA;
$('genis').classList.toggle('on', document.body.classList.contains('wide'));
$('menu').onclick = () => {
  if (narrow()) { document.body.classList.toggle('panelopen'); return; }
  const off = document.body.classList.toggle('nopanel');
  store.set('oku-panel', off ? 'kapali' : 'acik');
};
$('genis').onclick = () => {
  const on = document.body.classList.toggle('wide');
  $('genis').classList.toggle('on', on);
  store.set('oku-genis', on ? '1' : '0');
};

// ---------------------------------------------------------------- metin
const AR = '\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF';
const AR_RUN = new RegExp(`[${AR}](?:[${AR}\\s]*[${AR}])?`, 'g');
const bidi = h => h.replace(AR_RUN, '<bdi>$&</bdi>');
// köşeli işaretler: içinde numara olan kaynaklıdır (mavi, numaraları tıklanır: "[35]", "[dil; 35]", "[belâgat; 8, …]"),
// numarasız olan taslağın kendi etiketidir (turuncu: "[belâgat; istinbat]"). Kaynak kümesi taslak başınadır (SRC).
const SRC = {};
function marks(t, srcs, pid, set = 'y') {
  if (srcs) SRC[set] = srcs;
  const h = bidi(esc(t)).replace(/\[([^\]\n]{1,120})\]/g, (m, inner) => {
    if (!/\d/.test(inner)) return `<span class="tg">[${inner}]</span>`;
    const lin = inner.replace(/(^|[^\w\u00C0-\u024F])(\d+)(?![\w])/g, (x, pre, k) =>
      srcs && srcs[k] ? `${pre}<a class="n" data-k="${k}" data-p="${esc(pid)}" data-s="${esc(set)}">${k}</a>` : x);
    return `<span class="mk">[${lin}]</span>`;
  });
  // taslağın içindeki alıntı satırları ("> …") alıntı olarak görünür; Türkçe içindeki Arapça yalıtılır (parantez dönmesin)
  return h.split('\n').map(l => l.startsWith('&gt; ') ? `<span class="qline">${l.slice(5)}</span>` : l).join('<br>').replace(/<br>(<span class="qline">)/g, '$1').replace(/(<\/span>)<br>/g, '$1');
}
function srcBox(k, set = 'y') {
  let s = (SRC[set] || {})[k];
  if (!s) return '';
  if (typeof s === 'string') s = {satir: s};               // masadaki eski taslakların kaynakçası yalnız satırdır
  const name = s.kaynak && s.kaynak.ad ? (s.kaynak.bag ? `<a href="${esc(s.kaynak.bag)}" target="_blank" rel="noopener">${esc(s.kaynak.ad)}</a>` : esc(s.kaynak.ad)) : '';
  const ar = /[؀-ۿ]/.test(s.metin || '') && !/[a-zçğışöü]{4}/i.test((s.metin || '').slice(0, 80));
  const tr = !s.tercume ? '' : s.tercume_kim === 'abdulmecid'
    ? `<div class="lab" style="color:var(--accent)">Abdülmecid Nursî tercümesi (İşârât'ın Türkçesi; karşılığını yapay zekâ eşledi)</div><div class="tr" style="font-size:.95rem">${bidi(esc(s.tercume))}</div>`
    : `<div class="lab">Yapay zekâ tercümesi (yayımlanmış bir tercüme değildir)</div><div class="tr" style="font-size:.95rem">${bidi(esc(s.tercume))}</div>`;
  return `<div class="srcbox"><b>[${k}]</b> ${esc(s.satir)}` + tr
    + (s.metin ? (tr ? `<details><summary class="small">Arapça aslı</summary>` : '') + `<div class="${ar ? 'ar' : 'tr'}" style="font-size:${ar ? '1.15rem' : '.92rem'}">${bidi(esc(s.metin))}</div>` + (tr ? '</details>' : '') : '')
    + (tr && s.tercume_kim !== 'abdulmecid' ? '<div class="small muted">Asıl metin OpenITI, CC BY-NC-SA 4.0; tercüme de aynı lisansla.</div>' : '')
    + `<div class="small muted">Kaynak: ${name || '—'}</div></div>`;
}
document.addEventListener('click', e => {
  const a = e.target.closest('a.n');
  if (!a) return;
  e.preventDefault();
  const holder = a.closest('.blk');
  const side = $('side');
  if (side && getComputedStyle(side).display !== 'none') {    // platform, geniş ekran: yan sütunda
    const blk = a.closest('.blk');
    side.innerHTML = srcBox(a.dataset.k, a.dataset.s) + (blk ? `<p class="small"><a href="#/${esc(U.birim)}/${esc(blk.id)}">↑ paragrafa dön</a></p>` : '');
    for (const x of document.querySelectorAll('a.n.cur')) x.classList.remove('cur');
    a.classList.add('cur');
    return;
  }
  const id = 'src-' + a.dataset.s + '-' + a.dataset.p + '-' + a.dataset.k;
  const ex = document.getElementById(id);
  if (ex) { ex.remove(); return; }
  holder.insertAdjacentHTML('beforeend', `<div id="${esc(id)}">${srcBox(a.dataset.k, a.dataset.s)}</div>`);
});

// S7g (2026-11-21): taslağın kendi paragrafları etiketsiz (üst çubukta ve sayfa başında damga var); alıntı ve
// alıntının tercümesi etiketli kalır (kaynağın sözü ile modelin sözü karışmasın)
const KIND_LAB = {tercume: '', alinti_tercume: 'Yapay zekâ tercümesi (alıntının)', alinti: 'Alıntı', tr: ''};

function draftHTML(t) {
  const byId = Object.fromEntries(t.bloklar.map(b => [b.id, b]));
  const paired = new Set(t.bloklar.filter(b => b.tercumesi).map(b => b.tercumesi));
  const mine = id => NOTES.filter(n => n.paragraf === id);
  const L = [`<p class="small"><button data-v="ar" class="${VIEW.ar ? 'on' : ''}">Arapça</button> <button data-v="izah" class="${VIEW.izah ? 'on' : ''}">İzah</button>
    <span class="muted">· taslak sürüm ${t.surum} · <a href="#k-kunye">nasıl yazıldı</a></span></p>`];
  // alt başlıklar ("Ders: …", "Dersin sonu"): eşi olan Arapçanınki Türkçesine geçer; ders kutusu ve Risale'deki genişi
  const pairOf = Object.fromEntries(t.bloklar.filter(b => b.tercumesi).map(b => [b.tercumesi, b.id]));
  const head = {};
  for (const b of t.bloklar) if (b.ust_baslik) head[pairOf[b.id] || b.id] = b.ust_baslik;
  const visible = t.bloklar.filter(b => !((b.tur === 'ar' || b.tur === 'alinti_ar') && paired.has(b.id)));
  const wide = {};                                          // ders başlığı → içinde anılan ilk Risale bölümü
  let cur = null;
  for (const b of visible) {
    const h = head[b.id];
    if (h) cur = h.startsWith('Ders') ? h : null;
    if (cur && !wide[cur]) for (const k of (b.metin.match(/\[[^\]\n]*\]/g) || []).flatMap(x => x.match(/\d+/g) || [])) {
      const s = t.kaynaklar[k];
      if (s && s.sunucu === 'risale' && s.kaynak && s.kaynak.bag) { wide[cur] = s; break; }
    }
  }
  let sec = null, inDers = false;
  for (const b of visible) {
    if (b.bolum !== sec) {
      if (inDers) { L.push('</div>'); inDers = false; }
      sec = b.bolum; L.push(`<h2>${esc(U.bolum_adlari[sec] || sec)}</h2>`);
    }
    const hd = head[b.id];
    if (hd) {
      if (inDers) { L.push('</div>'); inDers = false; }
      if (hd.startsWith('Ders')) {
        const w = wide[hd];
        L.push(`<div class="ders"><h3>${bidi(esc(hd))}</h3>` + (w ? `<p class="small">Risale-i Nur'da genişi: <a href="${esc(w.kaynak.bag)}" target="_blank" rel="noopener">${esc(w.satir.split(' › “')[0])}</a></p>` : ''));
        inDers = true;
      } else if (!/^Dersin sonu/.test(hd)) L.push(`<h3>${bidi(esc(hd))}</h3>`);
    }
    const isAr = b.tur === 'ar' || b.tur === 'alinti_ar';
    const notes = mine(b.id);
    let h = `<div class="blk" id="${esc(b.id)}">`;
    const wholeOf = x => x && x.cumle ? `<details class="small"><summary>Kaynaktaki cümlenin tamamı</summary><p class="${/[؀-ۿ]/.test(x.cumle.slice(0, 40)) ? 'ar' : 'tr'}">${bidi(esc(x.cumle))}</p></details>` : '';
    const whole = wholeOf(b);
    // S7h: alıntının kaynağı kutunun başında (adı ve tıklanır numarası); Arapça gizliyken de belli olsun
    const srcOf = x => {
      const ks = ((x && x.kaynaklar) || []).filter(k => t.kaynaklar[k]);
      if (!ks.length) return '';
      const name = t.kaynaklar[ks[0]].satir.split(' › ')[0].replace(/ \(Arapça\)$/, '');
      return `: ${esc(name)} ` + marks(`[${ks.join(', ')}]`, t.kaynaklar, b.id);
    };
    if (isAr) h += `<div class="${b.tur === 'alinti_ar' ? 'quote' : ''}"><div class="lab">${b.tur === 'alinti_ar' ? 'Alıntı' + srcOf(b) : 'Taslağın Arapçası (yapay zekâ)'}</div><p class="ar">${marks(b.metin, t.kaynaklar, b.id)}</p>${whole}</div>`;
    else {
      const ar = b.tercumesi && byId[b.tercumesi];
      const pairAr = ar ? `<div class="arpair" ${VIEW.ar ? '' : 'hidden'}><p class="ar">${marks(ar.metin, t.kaynaklar, b.id)}</p></div>` : '';
      if (b.tur === 'alinti_tercume' && ar) {           // alıntı ve Türkçesi tek kutuda, kaynağıyla (S7h)
        const kim = b.abdulmecid ? `Abdülmecid Nursî tercümesi${ar.cumle ? ', kaynaktaki cümlenin tamamı' : ''}` : 'yapay zekâ tercümesi';
        h += `<div class="quote"><div class="lab">Alıntı${srcOf(ar)} · ${kim}</div>${pairAr}`
          + `<p class="tr">${bidi(esc(b.abdulmecid || b.metin))}</p>${b.abdulmecid ? '' : wholeOf(ar)}</div>`;
      } else {
        h += pairAr;
        h += `<div class="${b.tur === 'alinti' ? 'quote' : ''}">${b.tur === 'alinti' ? `<div class="lab">Alıntı${srcOf(b)}</div>` : KIND_LAB[b.tur] ? `<div class="lab">${KIND_LAB[b.tur]}</div>` : ''}<p class="tr">${marks(b.metin, t.kaynaklar, b.id)}</p>${whole}</div>`;
      }
      if (b.izah) h += `<div class="izah" ${VIEW.izah ? '' : 'hidden'}><div class="lab">izah</div>${marks(b.izah.metin, t.kaynaklar, b.id)}</div>`;
    }
    for (const f of b.isaretler || [])
      h += `<div class="flag">⚠ Bu atıf kaynağın dediğini aşıyor olabilir ([${esc(f.kaynak)}]; yapay zekâ denetçisinin hükmü, denetlenmedi) <details><summary class="small">gerekçe</summary>${esc(f.gerekce)}</details></div>`;
    h += `<div class="acts"><a data-act="atif" data-p="${esc(b.id)}">atıf</a><a data-act="not" data-p="${esc(b.id)}">not${notes.length ? ' (' + notes.length + ')' : ''}</a><a href="#/${esc(U.birim)}/${esc(b.id)}">bağlantı</a></div>`;
    h += notes.map(noteHTML).join('');
    L.push(h + '</div>');
  }
  if (inDers) L.push('</div>');
  return L.join('\n');
}

function simpleDraft(d, lang) {
  const L = []; let sec = null;
  for (const b of d.bloklar) {
    const key = b.capa.split('/')[0];
    if (key === 'Âyet') continue;
    if (key !== sec) { sec = key; L.push(`<h3>${esc(U.bolum_adlari[key] || key)}</h3>`); }
    if (lang && b.dil !== lang) continue;
    L.push(`<div class="blk"><div class="lab">${esc(b.capa)}${b.alinti ? ' · alıntı' : ''}</div><p class="${b.dil === 'ar' ? 'ar' : 'tr'}${b.alinti ? ' quote' : ''}" style="${b.dil === 'ar' ? 'font-size:1.15rem' : ''}">${esc(b.metin)}</p></div>`);
  }
  return L.join('');
}
function draftMeta(d) {

function sideHTML() {

function kapiHTML() {

  for (const k of U.masa.kapi) {
    const c = {karşılandı: 0, kısmen: 0, reddedildi: 0, anılmadı: 0}; k.notlar.forEach(x => c[x.durum]++);
    L.push(`<h3>${{kapi: 'Kalite kapısı', kapi2: 'İkinci tur', okuyucu: 'Okuyucu notlarıyla düzeltme'}[k.tur] || esc(k.tur)} (${esc(k.surum || '')}): taslak ${k.taslak} → ${k.yeni ?? '?'} <span class="small muted">(${k.notlar.length} not: ${c['karşılandı']} karşılandı, ${c['kısmen']} kısmen (karşılandı, bir kısmı gerekçesiyle reddedildi), ${c.reddedildi} reddedildi, ${c['anılmadı']} anılmadı)</span></h3>`);
    for (const x of k.notlar)
      L.push(`<div class="note"><b>${esc(x.no)}</b> <span class="tag">${esc(x.kaynak || '')}</span><span class="tag">${esc(x.tur || '')}</span><span class="tag">${esc(x.oncelik || '')}</span> ${esc(x.capa || '')}`
        + (x.alinti ? `<br><i>«${esc(x.alinti)}»</i>` : '') + `<br>${esc(x.metin)}` + (x.oneri ? `<br><span class="small muted">Öneri: ${esc(x.oneri)}</span>` : '')
        + `<br><span class="small ${x.durum === 'karşılandı' || x.durum === 'kısmen' ? 'ok' : (x.durum === 'reddedildi' ? 'bad' : 'muted')}">${esc(x.durum)}${x.nasil ? ': ' + esc(x.nasil.join(', ')) : ''}</span>${x.gerekce ? `<br><span class="small bad">Ret gerekçesi: ${esc(x.gerekce)}</span>` : ''}</div>`);
  }
  for (const k of U.masa.kapali) {
    L.push(`<h3>Kapalı eleştirmen (İşârât'ı görmeden): taslak ${k.taslak} <span class="small muted">${esc(k.dosya)} · ${k.notlar.length} not</span></h3>`);
    if (k.ozet) L.push(`<p class="small">${esc(typeof k.ozet === 'string' ? k.ozet : JSON.stringify(k.ozet))}</p>`);
    for (const x of k.notlar)
      L.push(`<div class="note"><span class="tag">${esc(x.tur)}</span><span class="tag">${esc(x.oncelik || '')}</span> ${esc(x.capa || '')}${x.taslak_alinti ? `<br><i>«${esc(x.taslak_alinti)}»</i>` : ''}<br>${esc(x.metin)}${x.oneri ? `<br><span class="small muted">Öneri: ${esc(x.oneri)}</span>` : ''}${x.ehline_sor ? `<br><span class="small">Ehline sor: ${esc(x.soru)}</span>` : ''}</div>`);
  }
  for (const k of U.masa.acik) {
    L.push(`<h3>Eksik notları (taslak ${k.taslak}; taslağa eklenmedi)</h3>`);
    for (const x of k.notlar) L.push(`<div class="note">${esc(x.capa || '')}: ${esc(x.metin)}${x.oneri ? `<br><span class="small muted">Öneri: ${esc(x.oneri)}</span>` : ''}</div>`);
  }
  return L.join('');
}
function nisbetHTML() {
  const L = ['<p class="small muted">Nisbet denetçisi: taslağın kaynağa dayandırdığı her söz kaynakta var mı (dogru, asiyor: kaynağın dediğini aşıyor, kaynakta_yok, nisbet_yok: atıfsız hüküm, nakil).</p>'];
  for (const k of U.masa.nisbet) {
    const c = {}; k.hukumler.forEach(h => c[h.hukum] = (c[h.hukum] || 0) + 1);
    L.push(`<h3>Taslak ${k.taslak} <span class="small muted">${Object.entries(c).map(([a, b]) => a + ' ' + b).join(' · ')}</span></h3><table class="t">`);
    for (const h of k.hukumler.filter(h => h.hukum !== 'dogru'))
      L.push(`<tr><td>[${esc(h.kaynak)}]</td><td class="bad">${esc(h.hukum)}</td><td>${h.taslak_alinti ? `<i>«${esc(h.taslak_alinti)}»</i><br>` : ''}${esc(h.gerekce)}</td></tr>`);
    L.push('</table>');
  }
  return L.join('');
}
function notesTabHTML() {
  const how = '<p class="small muted">Notlarla düzeltme elle, yalnız bu birimde: <code>uv run python scripts/d1-birim.py notlarla ' + esc(U.birim) + '</code> (önce <code>--deneme</code>). Yayımlanan son sürüme bağlı açık notlar (soru hariç) kapı d3\'ün kurallarıyla düzeltmeye gider; karşılananlar "işlendi" olur, reddedilenler gerekçesiyle açık kalır; yeni sürüm açılır, eskisi silinmez.</p>';
  if (!NOTES.length) return '<p class="muted">Bu birimde okuyucu notu yok.</p>' + how;
  return '<p class="small muted">Okuyucu notları ve hayatı: açık → işlendi (işleyen sürümle) → kapandı; not silinmez, yazan geri çeker.</p>' + how
    + NOTES.map(n => `<div class="blk">${n.paragraf ? `<a href="#/${esc(U.birim)}/${esc(n.paragraf)}" class="small">${esc(n.paragraf)}</a>` : ''}${noteHTML(n)}</div>`).join('');
}
document.addEventListener('click', e => {
  const b = e.target.closest('button[data-n]');
  if (!b) return;
  VIEW.n = b.dataset.n; render();
});
document.addEventListener('change', e => {
  const s = e.target.closest('select[data-s]');
  if (!s) return;
  VIEW[s.dataset.s] = s.value; render();
});

// ---------------------------------------------------------------- yönlendirme
function home() {
  const last = store.get('oku-son');
  $('ttl').textContent = MASA ? 'Ar-ge masası · birimler' : "Kur'ân · yapay zekâ taslakları";
  $('main').innerHTML = `<h1>${MASA ? 'Birimler' : "Kur'ân'ın yapay zekâ taslakları"}</h1>
    <div class="stamp"><b>Buradaki metinler yapay zekâ taslağıdır; tefsir değildir.</b> İşârâtü'l-İ'câz'ın usulüyle, kaynaklara (Risale-i Nur, klasik tefsirler, belâgat eserleri, hadis kitapları) bağlı kalarak yazıldılar; her atıfın kaynağı tıklayınca görünür. Nasıl yazıldıklarını <a href="__USUL__">usul sayfası</a> anlatır.</div>
    ${last ? `<p>Kaldığınız yer: <a href="${esc(last)}">${esc(last.replace('#/', 'Bakara ').split('/').slice(0, 1).join(''))}</a></p>` : ''}
    <p>Soldaki panelden bir birim seçin ya da âyete gidin ("2:255"). Bakara 1–33'te önce müellifin sözü (İşârâtü'l-İ'câz), yanında onu görmeden yazılmış taslak durur.</p>
    <p class="small muted">Yanlış gördüğünüz yere paragrafın altındaki "not" ile not bırakabilirsiniz.</p>`;
  panel(null);
}
const fold = s => s.toLocaleLowerCase('tr').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ı/g, 'i');
let ARA = null;
async function search(q) {
  panel(null);
  $('ttl').textContent = 'Arama';
  $('main').innerHTML = '<p class="muted">aranıyor…</p>';
  if (!ARA) { ARA = await getJSON(MASA ? 'oku/veri/ara.json' : 'veri/ara.json'); ARA.forEach(x => x.f = fold(x.t)); }
  const f = fold(q), hits = ARA.filter(x => x.f.includes(f));
  $('main').innerHTML = `<h1>«${esc(q)}»</h1><p class="small muted">${hits.length} yer (yayımlanan taslakların Türkçesinde ve izahında; yapay zekâ taslakları)${hits.length ? '' : '. Taslakların Türkçesi eski dille yazılır; eski kelimesiyle de deneyin (ör. "nankörlük" yerine "küfran").'}</p>`
    + hits.slice(0, 300).map(x => {
      const i = x.f.indexOf(f), a = Math.max(0, i - 140);
      const u = INDEX.birimler.find(b => b.id === x.b);
      return `<div class="note"><a href="#/${esc(x.b)}/${esc(x.p)}">Bakara ${esc(rng(u.ayet))}</a>${x.i ? ' <span class="tag">izah</span>' : ''}<br>${a ? '…' : ''}${esc(x.t.slice(a, i))}<mark>${esc(x.t.slice(i, i + q.length))}</mark>${esc(x.t.slice(i + q.length, i + q.length + 200))}…</div>`;
    }).join('');
}
async function continuous() {
  // sûre boyunca kesintisiz okuma: taslağı olan birimler sırayla, aşağı indikçe sonraki yüklenir (Türkçe ve izah)
  panel(null);
  $('ttl').textContent = 'Bakara · kesintisiz';
  const ids = INDEX.birimler.filter(x => x.taslak).map(x => x.id);
  $('main').innerHTML = '<h1>Bakara · kesintisiz okuma</h1><div class="stamp"><b>Yapay zekâ taslaklarıdır; tefsir değildir.</b> Yalnız Türkçesi ve izahı; birimin tamamı için başlığına tıklayın.</div><div id="akis"></div><p id="son" class="muted small">yükleniyor…</p>';
  let k = 0;
  const more = async () => {
    if (k >= ids.length) { $('son').textContent = 'Sûrenin yazılmış taslaklarının sonu.'; return; }
    const d = await getJSON(DATA + ids[k++] + '.json');
    const t = d.taslak, L = [`<h2><a href="#/${esc(d.birim)}/~taslak">Bakara ${esc(rng(d.ayet))}</a></h2>`];
    for (const a of d.ayetler) L.push(`<p class="ar">${esc(a.metin)} ﴿${a.n}﴾</p>`);
    let sec = null;
    for (const b of t.bloklar) {
      if (!['tr', 'tercume', 'alinti', 'alinti_tercume'].includes(b.tur)) continue;
      if (b.bolum !== sec) { sec = b.bolum; L.push(`<h3>${esc(d.bolum_adlari[sec] || sec)}</h3>`); }
      L.push(`<p class="tr${b.tur === 'alinti' ? ' quote' : ''}">${bidi(esc(b.metin))}</p>`);
      if (b.izah && VIEW.izah) L.push(`<div class="izah small">${bidi(esc(b.izah.metin))}</div>`);
    }
    $('akis').insertAdjacentHTML('beforeend', L.join(''));
    $('son').textContent = k < ids.length ? 'aşağı indikçe sonraki birim yüklenir…' : 'Sûrenin yazılmış taslaklarının sonu.';
  };
  await more();
  const io = new IntersectionObserver(async es => { if (es[0].isIntersecting) await more(); });
  io.observe($('son'));
}
async function route() {
  const parts = location.hash.slice(2).split('/').filter(Boolean);
  if (!parts.length) return home();
  if (parts[0] === '~ara') return search(decodeURIComponent(parts.slice(1).join('/')));
  if (parts[0] === '~sure') return continuous();
  const uid = parts[0], focus = parts[1] && !parts[1].startsWith('~') ? parts[1] : null;
  if (!U || U.birim !== uid) {
    $('main').innerHTML = '<p class="muted">yükleniyor…</p>';
    try { U = await getJSON(DATA + uid + '.json'); }
    catch (e) {
      const x = INDEX.birimler.find(x => x.id === uid);
      panel(uid);
      $('main').innerHTML = x ? `<h1>Bakara ${esc(rng(x.ayet))}</h1><p class="muted">Bu birimin taslağı henüz yazılmadı.</p>` : '<p class="muted">Böyle bir birim yok.</p>';
      return;
    }
    await loadNotes();
  }
  panel(uid);
  render(focus);
  store.set('oku-son', '#/' + uid);
  document.body.classList.remove('panelopen');
}
addEventListener('hashchange', route);
(async () => {
  try { VIEW = Object.assign(VIEW, JSON.parse(store.get('oku-view') || '{}')); } catch (e) {}
  try { INDEX = await getJSON(DATA + 'index.json'); } catch (e) { $('main').textContent = 'Dizin okunamadı.'; return; }
  try { ME = await getJSON('/taslak/ben'); $('ben').textContent = ME.name || ''; $('masaBtn').hidden = ME.scope !== 'masa'; } catch (e) {}
  route();
})();
</script></body></html>
