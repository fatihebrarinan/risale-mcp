<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Âyet Masası</title>
<style>
:root { --bg: #fbfaf7; --fg: #1d1d1b; --muted: #6b6a66; --line: #dcd8cf; --card: #ffffff; --soft: #f3f1ec;
        --accent: #1f5c3f; --accent-soft: #e2efe7; --ai: #5a4a8a; --ai-soft: #eeebf7; --hl: #fbe38a; --hl-fg: #1d1d1b;
        --rel: #fdf6d8; --bad: #a3271f; --warn: #8a4b00; --warn-soft: #fdf0dc; --src: #1f4f7a; --src-soft: #e3eef8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161614; --fg: #e8e6e1; --muted: #9c9a94; --line: #34332f; --card: #1f1e1b; --soft: #26251f;
  --accent: #7cc49d; --accent-soft: #1c3127; --ai: #b9a8ee; --ai-soft: #2a2540; --hl: #7a6312; --hl-fg: #fff6d6;
  --rel: #2d2915; --bad: #f08a80; --warn: #f0b46a; --warn-soft: #3a2a14; --src: #8cc0ef; --src-soft: #18293a; } }
:root[data-theme="dark"] { --bg: #161614; --fg: #e8e6e1; --muted: #9c9a94; --line: #34332f; --card: #1f1e1b; --soft: #26251f;
  --accent: #7cc49d; --accent-soft: #1c3127; --ai: #b9a8ee; --ai-soft: #2a2540; --hl: #7a6312; --hl-fg: #fff6d6;
  --rel: #2d2915; --bad: #f08a80; --warn: #f0b46a; --warn-soft: #3a2a14; --src: #8cc0ef; --src-soft: #18293a; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 system-ui, "Noto Sans", sans-serif; }
button, select, input, textarea { font: inherit; font-size: .85rem; color: var(--fg); }
.ar, .arw { font-family: "Noto Naskh Arabic", "Amiri", "Scheherazade New", serif; }
.ar { direction: rtl; text-align: right; font-size: 1.22rem; line-height: 2; }
.arw { font-size: 1.1em; }
.serif { font-family: "Noto Serif", "DejaVu Serif", Georgia, serif; }
.muted { color: var(--muted); }
.small { font-size: .8rem; }

header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
         padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
header h1 { font-size: 1rem; margin: 0; }
header label { font-size: .8rem; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
select, input, textarea { padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: var(--card); padding: 3px 12px; cursor: pointer; }
.seg button[aria-pressed=true] { background: var(--accent); color: var(--bg); }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
.msg { font-size: .8rem; color: var(--bad); }
.spacer { flex: 1; }

#ayah { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); background: var(--card); }
.levels { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 10px; }
.lvl { border: 1px solid var(--line); background: var(--soft); border-radius: 999px; padding: 4px 14px; cursor: pointer; }
.lvl b { font-weight: 600; }
.lvl[aria-pressed=true] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.chip[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); }
body.sel #ayah { padding: 6px 16px 4px; }
body.sel .chip { font-size: 1.45rem; line-height: 1.7; padding-bottom: 12px; }
body.sel .vno { font-size: 1.15rem; }
body.sel .meal { font-size: .76rem; margin: 0 0 2px; }
body.sel .levels { margin-bottom: 4px; }
body.sel .hint { display: none; }
.nk { font-size: inherit; }
.verses { display: flex; flex-direction: column; gap: 4px; align-items: center; }
.verse { display: flex; flex-wrap: wrap; direction: rtl; justify-content: center; align-items: flex-start; gap: 4px 6px; }
.chip { position: relative; border: 1px solid transparent; background: none; border-radius: 10px; cursor: pointer;
        padding: 0 8px 14px; font-family: "Amiri Quran", "Amiri", "Scheherazade New", "Noto Naskh Arabic", serif;
        font-size: 2.1rem; line-height: 1.9; color: var(--fg); }
.chip:hover { border-color: var(--line); background: var(--soft); }
.chip .n { position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); font: 600 .68rem/1 system-ui, sans-serif;
           color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 6px; direction: ltr; }
.chip[aria-pressed=true] .n { background: var(--accent); color: var(--bg); }
.chip .n.zero { color: var(--muted); background: none; }
.vno { font-family: "Amiri", serif; font-size: 1.6rem; color: var(--muted); align-self: center; padding: 0 4px 14px; }
.meal { font-size: .88rem; color: var(--muted); text-align: center; margin: 0 0 6px; }
.meal i { font-size: .75rem; }
.hint { text-align: center; font-size: .82rem; color: var(--muted); margin: 6px 0 0; }

#panes { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); }
.pane { position: sticky; top: var(--head-h, 52px); height: calc(100vh - var(--head-h, 52px)); overflow: auto;
        padding: 0 14px 60px; border-right: 1px solid var(--line); min-width: 0; }
.pane:last-child { border-right: 0; }
.pane.draft { background: var(--ai-soft); }
.ph { position: sticky; top: 0; z-index: 2; padding: 8px 0 6px; display: flex; flex-wrap: wrap; gap: 4px 10px;
      align-items: center; background: var(--bg); border-bottom: 1px solid var(--line); }
.pane.draft .ph { background: var(--ai-soft); }
.ph select { max-width: 100%; font-weight: 600; }
.ph .x { padding: 0 8px; }
.layers { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 2px 14px; }
.layers label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
.bhead { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.mkrs { margin-left: auto; display: inline-flex; gap: 4px; flex-wrap: wrap; }
.mkr { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 0 8px; font-size: .74rem; cursor: pointer; }
.mkr.karsi { color: var(--accent); } .mkr.critic { color: var(--ai); } .mkr.kcritic { color: var(--src); } .mkr.bk { color: var(--warn); }
.tag.kc { background: var(--src); color: var(--bg); }
.mkr[aria-pressed=true] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.blk.found { border-left: 4px solid var(--accent); } .blk.contra { border-left: 4px solid var(--bad); }
.blk.extra { border-left: 4px solid var(--muted); }
.legend { margin: 8px 0; display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); }
.legend .lg { padding-left: 6px; border-left: 4px solid; }
.lg.found { border-color: var(--accent); } .lg.contra { border-color: var(--bad); } .lg.extra { border-color: var(--muted); }
.opened { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 8px; }
.lists { margin: 6px 0; }
.ph h2 { margin: 0; font-size: 1rem; }
.where { font-size: .82rem; color: var(--muted); }
.where .arw { color: var(--fg); }
.tag { display: inline-block; font-size: .7rem; font-weight: 600; border-radius: 4px; padding: 0 6px; vertical-align: 1px; }
.tag.ai { background: var(--ai); color: var(--bg); }
.tag.src { background: var(--accent); color: var(--bg); }
.tag.w { background: var(--warn-soft); color: var(--warn); }
.tag.g { background: var(--soft); color: var(--muted); border: 1px solid var(--line); }

h3 { font-size: .9rem; margin: 18px 0 6px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
h3 .muted { font-weight: 400; font-size: .78rem; }
.para { margin: 0 0 10px; }
.s { border-radius: 3px; cursor: pointer; }
.s.rel { background: var(--rel); }
.s.focus, mark.w.focus { background: var(--hl); color: var(--hl-fg); outline: 2px solid var(--hl); }
mark.w { background: none; color: inherit; border-bottom: 2px solid var(--accent); }
details { margin: 0 0 6px; }
details > summary { cursor: pointer; }
.wk { border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 4px 10px; margin: 0 0 6px; }
.wk > summary { font-size: .86rem; }
.wk > summary .muted { font-size: .78rem; }
.ctx { margin: 6px 0; padding: 4px 0; border-top: 1px dashed var(--line); }
.ayahline { font-size: .9rem; color: var(--muted); }
.gap { text-align: center; color: var(--muted); font-size: .8rem; }
.linkish { color: var(--src); cursor: pointer; text-decoration: underline; text-decoration-style: dotted; background: none; border: 0; padding: 0; font-size: .8rem; }
.srcbox { border: 2px solid var(--src); border-radius: 8px; background: var(--src-soft); padding: 8px 10px; margin: 10px 0; }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tabs button { border: 1px solid var(--line); background: var(--card); border-radius: 6px 6px 0 0; padding: 4px 10px; cursor: pointer; }
.tabs button[aria-selected=true] { background: var(--ai); color: var(--bg); border-color: var(--ai); }
.intro { font-size: .82rem; background: var(--card); border-left: 3px solid var(--ai); border-radius: 0 6px 6px 0;
         padding: 6px 10px; margin: 10px 0; }
.intro summary { font-weight: 600; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 0 0 10px; }
.card.focus { outline: 3px solid var(--hl); }
.card .top { cursor: pointer; }
.card .head { display: flex; gap: 8px; align-items: baseline; margin: 0 0 4px; }
.card .no { font-weight: 700; font-size: .8rem; color: var(--ai); white-space: nowrap; }
.card .fold { margin-left: auto; border: 1px solid var(--line); background: var(--soft); border-radius: 4px; padding: 0 8px;
              cursor: pointer; font-size: .75rem; white-space: nowrap; }
.card.small { padding: 4px 10px; margin-bottom: 6px; opacity: .85; }
.card.small .head { margin: 0; }
.card.small .gist { font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.marks { font-size: .75rem; white-space: nowrap; }
.marks .done { color: var(--accent); font-weight: 600; }
.foldbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; font-size: .78rem; }
.tag.smp { background: var(--warn); color: var(--bg); }
.card.insample { border-left: 4px solid var(--warn); }
.samplebox { background: var(--card); border: 1px solid var(--warn); border-radius: 8px; padding: 6px 10px; margin: 0 0 10px; font-size: .82rem; }
.samplebox summary { font-weight: 600; }
.bkbox { border-color: var(--accent); }
.bklist { margin: 4px 0; padding-left: 1.8em; max-height: 40vh; overflow-y: auto; }
.bklist li { margin: 2px 0; } .bklist li.here { background: var(--accent-soft); border-radius: 3px; }
.bklist button { text-align: start; }
.bknav { display: flex; justify-content: space-between; margin-top: 8px; }
.bklist .done { color: var(--accent); font-weight: 600; }
.foldbar button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 0 10px; cursor: pointer; }
.strip { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; font-size: .78rem; }
.strip button { border: 1px solid var(--line); background: var(--soft); border-radius: 4px; padding: 0 6px; cursor: pointer; }
.strip button[aria-current=true] { border-color: var(--ai); background: var(--ai); color: var(--bg); }
.reader { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; }
.q { background: var(--soft); border-radius: 4px; padding: 2px 8px; margin: 4px 0; }
.ev { display: inline-flex; gap: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; vertical-align: middle; }
.ev button { border: 0; border-right: 1px solid var(--line); background: var(--card); padding: 1px 8px; cursor: pointer; font-size: .78rem; }
.ev button:last-child { border-right: 0; }
.ev button[aria-pressed=true] { background: var(--accent); color: var(--bg); }
.blk { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; margin: 0 0 8px; }
.blk.focus { outline: 3px solid var(--hl); }
.blk.quote { border-style: dashed; }
.izah { margin-top: 6px; padding: 6px 8px; border-left: 3px solid var(--line); font-size: .95em; line-height: 1.5; }
mark.fq { background: var(--hl); color: var(--hl-fg); }
.mk { font-size: .7rem; padding: 0 4px; border-radius: 3px; white-space: nowrap; direction: ltr; unicode-bidi: isolate;
      cursor: pointer; color: var(--src); background: var(--src-soft); font-family: system-ui, sans-serif; }
.mk.own { color: var(--warn); background: var(--warn-soft); }
.idx { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
.idx button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 0 8px; cursor: pointer; font-size: .78rem; }
.idx button.done { border-color: var(--accent); color: var(--accent); }
.idx button.here { background: var(--ai); color: var(--bg); border-color: var(--ai); }
.claim { background: var(--hl); color: var(--hl-fg); border-radius: 3px; }
.bkq { margin: 6px 0; padding: 6px 10px; background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 3px; font-size: 1rem; }
.empty { color: var(--muted); font-size: .85rem; margin: 12px 0; }
.welcome { max-width: 560px; margin: 24px auto; font-size: .9rem; }
.welcome li { margin: 4px 0; }
.credits { margin: 28px 0 0; padding-top: 8px; border-top: 1px solid var(--line); font-size: .76rem; color: var(--muted); }
.credits a { color: inherit; }
@media (max-width: 900px) {
  #panes { grid-template-columns: 1fr; }
  .pane { position: static; height: auto; overflow: visible; border-right: 0; border-bottom: 2px solid var(--line); }
  .chip { font-size: 1.6rem; }
}
</style></head>
<body>
<header id="hdr">
  <h1>Âyet masası</h1>
  <label>Âyet <select id="unit"></select></label>
  <button class="btn" id="addpane" title="Bir yan daha aç (en çok 4)">+ yan ekle</button>
  <label title="Taslakların adını ve nasıl yazıldığını gizler"><input type="checkbox" id="blind"> kör kip</label>
  <label>Dil <span class="seg" id="lang"><button data-v="tr">Türkçe</button><button data-v="ar">Arapça</button></span></label>
  <label id="readerw">Okuyucu <input id="reader" size="10" placeholder="adınız"></label>
  <span id="who" class="small muted" hidden></span>
  <span class="spacer"></span>
  <span id="progress" class="small muted"></span>
  <button class="btn" id="export" title="İşaretleri dosyaya yaz (eski okuma sayfasıyla aynı biçim)">Dışa aktar</button>
  <label class="btn" style="color:var(--fg)">İçe aktar<input type="file" id="import" accept=".json" hidden></label>
  <span id="farklar"></span>
  <a class="btn" id="logout" href="/taslak/cikis" hidden style="text-decoration:none;color:var(--fg)">Çıkış</a>
  <span class="msg" id="msg"></span>
</header>
<section id="ayah"></section>
<div id="panes"></div>
<script>
const DATA = {data};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};
// İşaretler eski okuma sayfasının anahtarlarıyla (aynı tarayıcıda ortak; dışa aktarma aynı biçim)
let yzEval = store.get('d1-yz-sinama', {});     // "birim|taslak|okuyucu-modeli|nükte" ya da "birim|taslak|fazla|anahtar"
let yzSuz = store.get('d1-yz-suzgec', {});      // "birim|taslak|not anahtarı"
let bkMarks = store.get('d1-bilirkisi', {});    // "birim|kısım|madde"
const U = DATA.unit, Y = DATA.yz;
const DKEYS = Object.keys(DATA.drafts);
const MAXP = 4;                                  // en çok yan (S6: masaüstünde 3, genişte 4)
const st = Object.assign({loc: null, lang: 'tr', blind: false, onlySample: false}, store.get('d1-masa', {}));
st.focus = null; st.dfocus = null; st.srcbox = null; st.draft = DKEYS[0];   // st.draft: kartlar çizilirken o yanın taslağı
const CHIP = Object.fromEntries(DATA.chips.map(c => [c.id, c]));
const LOC = {'L:munasebet': 'Önceki âyetlerle münasebet', 'L:nazim': 'Cümlelerin nazmı',
             'L:belirsiz': 'Cümleler ve kelimesi belirsizler', 'L:tumu': 'Metinlerin tamamı', 'L:genel': 'Taslağın geneli'};
const LOC_V = {'L:munasebet': 'V1', 'L:nazim': 'V2'};
const LOC_HELP = {'L:munasebet': 'İşârât\'ın birinci vechi: bu âyetin önceki âyetlerle bağı.',
                  'L:nazim': 'İşârât\'ın ikinci vechi: cümlelerin birbirini nasıl istediği (temsil).',
                  'L:belirsiz': 'Üçüncü vecihten, birden çok cümleyi kapsayan ya da hangi kelimeye ait olduğu veriden çıkmayanlar.',
                  'L:tumu': 'İşârât\'ın bu birimdeki metninin, müfessirlerin birimlerinin ve taslakların tamamı.'};
if (st.loc && !CHIP[st.loc] && !LOC[st.loc]) st.loc = null;
const DUR = {aynen: ['✓', 'aynen'], kismen: ['◐', 'kısmen'], farkli_gerekce: ['↔', 'farklı gerekçe'], yok: ['·', 'yok']};
const FOUNDISH = ['aynen', 'kismen'];
const MODEL = {fable: 'Fable', opus: 'Opus'};
const CTYPE = {dogru: 'doğru, iyi', yanlis: 'yanlış', eksik: 'eksik', fazla: 'fazla', uydurma: 'uydurma', irab: "i'râb, dil",
               belagat: 'belâgat', usul: 'usul', kaynak: 'kaynak, atıf', uslup: 'üslûp, tercüme', diger: 'diğer',
               kismen: 'kısmen', farkli_gerekce: 'farklı gerekçe', kapsam: 'kapsam ve derece'};
const ISR = {kaynakli: 'kaynaklı', kendi_tespiti: 'kendi tespiti', isaretsiz: 'işaretsiz'};
const BKV = {dogru: 'doğru', yanlis: 'yanlış', emin_degilim: 'emin değilim'};
const BKD = {'': 'dayanak türü…', kaynak: 'kaynak (cümle kimliği)', kisi: 'kişi (yalnız alanı)', kanaat: 'kendi kanaatim', yz: 'yapay zekâ'};
const LAYERS = [['karsi', "İşârât'la karşılaştırma"], ['critic', 'Eleştirmen (açık kitap)'], ['kcritic', 'Kapalı kitap eleştirmen'], ['bk', 'Bilirkişi soruları']];
const PRI = {yuksek: 'yüksek', orta: 'orta', dusuk: 'düşük'};

// --- yanlar (S6): her yan Kaynaklar, İşârât'ın metni ya da bir taslak; taslak yanında katmanlar
function newDraftPane(dk) { return {k: 'draft', d: dk, L: {karsi: true, critic: false, kcritic: false, bk: false}, open: {}}; }
let panes = store.get('d1-masa-yanlar-' + U, null) || [{k: 'src'}, newDraftPane(DKEYS[DKEYS.length - 1])];
panes = panes.filter(p => p.k !== 'draft' || DATA.drafts[p.d]).slice(0, MAXP);
if (!panes.length) panes = [{k: 'src'}];
panes.forEach(p => { p.open = {}; if (p.k === 'draft') p.L = Object.assign({karsi: true, critic: false, kcritic: false, bk: false}, p.L || {}); });
function savePanes() { store.set('d1-masa-yanlar-' + U, panes.map(p => ({k: p.k, d: p.d, L: p.L}))); }
function withDraft(dk, fn) { const o = st.draft; st.draft = dk; try { return fn(); } finally { st.draft = o; } }

// --- kör kip: taslaklar "Taslak A, B…" diye, sabit tohumla karışık sırada; bilgi satırı gizli
const BLIND = (() => {
  const ks = [...DKEYS]; let s = 7;
  for (const c of U) s = (s * 31 + c.charCodeAt(0)) >>> 0;
  for (let i = ks.length - 1; i > 0; i--) { s = (s * 1103515245 + 12345) >>> 0; const j = s % (i + 1); [ks[i], ks[j]] = [ks[j], ks[i]]; }
  return Object.fromEntries(ks.map((k, i) => [k, 'Taslak ' + 'ABCDEFGHIJKLMNOP'[i]]));
})();
function draftOrder() { return st.blind ? [...DKEYS].sort((a, b) => BLIND[a].localeCompare(BLIND[b])) : DKEYS; }
function draftLabel(dk) { return st.blind ? BLIND[dk] : (DATA.drafts[dk] ? DATA.drafts[dk].label : dk); }
function draftAbout(dk) { return st.blind ? '' : (DATA.drafts[dk] || {}).about || ''; }

function persist() { store.set('d1-masa', {loc: st.loc, lang: st.lang, blind: st.blind, onlySample: st.onlySample}); }
function say(t) { $('#msg').textContent = t; if (t) setTimeout(() => { if ($('#msg').textContent === t) $('#msg').textContent = ''; }, 6000); }
let ACCOUNT = null;                              // sitede girişli hesabın adı (/taslak/ben); dosyadan açılınca yok
function reader() { return ACCOUNT || $('#reader').value.trim(); }
function needReader() { if (reader()) return false; say('Önce okuyucu adınızı yazın.'); $('#reader').focus(); return true; }

// --- Arapça normalleştirme (betikteki `norm` ile aynı)
const HAR = /[ً-ٰٟۖ-ۭـ]/g;
function norm(t) { return t.replace(HAR, '').replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/[^ء-ي]/g, ''); }
function eq(tok, w) { return tok === w || ('وف'.includes(w[0]) && w.length > 3 && tok === w.slice(1)); }
// Metindeki âyet kelimelerini işaretle: kelime düğmesinin sözleri art arda geçiyorsa
function wordMarks(text, chipIds) {
  const parts = text.split(/(\s+)/), toks = [];
  parts.forEach((p, i) => { if (p.trim()) toks.push([i, norm(p)]); });
  const hit = new Set();
  for (const cid of chipIds) {
    const n = CHIP[cid].norm;
    for (let s = 0; s + n.length <= toks.length; s++)
      if (n.every((w, k) => toks[s + k][1] && eq(toks[s + k][1], w))) for (let k = 0; k < n.length; k++) hit.add(toks[s + k][0]);
  }
  return {hit: hit.size > 0, html: parts.map((p, i) => hit.has(i) ? `<mark class="w">${esc(p)}</mark>` : esc(p)).join('')};
}
function chipIn(text, cid) { return wordMarks(text, [cid]).hit; }

// --- alıntıyı metinde bul (hareke, noktalama, büyük-küçük harf yok sayılarak); "…" ile atlanan yer serbest
function sig(c) {
  const d = c.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(HAR, '');
  return d.replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').toLocaleLowerCase('tr').replace(/[^\p{L}\p{N}]/gu, '');
}
function locate(text, quote) {
  if (!quote) return null;
  const idx = [], chars = [];
  for (let i = 0; i < text.length; i++) { const s = sig(text[i]); for (const ch of s) { idx.push(i); chars.push(ch); } }
  const hay = chars.join('');
  const segs = quote.split(/…|\.\.\./).map(x => [...x].map(sig).join('')).filter(x => x.length >= 4);
  if (!segs.length) return null;
  const find = (needle, from) => {
    let p = hay.indexOf(needle, from);
    if (p < 0 && needle.length > 30) { p = hay.indexOf(needle.slice(0, 30), from); if (p >= 0) needle = needle.slice(0, 30); }
    return p < 0 ? null : [p, p + needle.length];
  };
  const a = find(segs[0], 0); if (!a) return null;
  let b = a;
  if (segs.length > 1) { const z = find(segs[segs.length - 1], a[1]); if (z) b = z; }
  return [idx[a[0]], idx[b[1] - 1] + 1];
}

// --- taslak metni: **kalın**, [n] kaynak işaretleri, Türkçedeki Arapça yalıtılır
const ARUN = /[؀-ۿﭐ-﷿ﹰ-﻿][؀-ۿﭐ-﷿ﹰ-﻿\s\-]*/g;
function trEsc(t) { return esc(t).replace(ARUN, m => `<bdi class="arw" dir="rtl">${m.trim()}</bdi>` + (m.endsWith(' ') ? ' ' : '')); }
function inline(text, dk, lang) {
  let s = esc(text).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  if (lang === 'tr') s = s.replace(ARUN, m => `<bdi class="arw" dir="rtl">${m.trim()}</bdi>` + (m.endsWith(' ') ? ' ' : ''));
  const src = DATA.drafts[dk].sources;
  return s.replace(/\[([^\]\n]{1,80})\]/g, (m, inner) => {
    const nums = inner.match(/\b\d+\b/g) || [];
    if (!nums.length) return m;
    const own = inner.includes('kendi tespiti') ? ' own' : '';
    const title = nums.map(n => `[${n}] ${src[n] ? src[n].c : ''}`).join(' | ');
    return `<span class="mk${own}" data-src="${nums[0]}" data-draft="${dk}" title="${esc(title)}">[${inner}]</span>`;
  }).replace(/\n/g, '<br>');
}
function draftText(text, dk, lang, quote) {
  const r = quote ? locate(text, quote) : null;
  if (!r) return inline(text, dk, lang);
  return inline(text.slice(0, r[0]), dk, lang) + '<mark class="fq">' + inline(text.slice(r[0], r[1]), dk, lang) + '</mark>' + inline(text.slice(r[1]), dk, lang);
}

function sentHtml(s, opts) {

  return `<span class="${cls}" data-sid="${esc(s.id)}">${wm.html}</span>`;
}
// Bir birimin cümlelerinden kelimenin geçtikleri ve odaktakiler, birer cümle bağlamla
function excerpt(rows, hitFn) {
  const flat = [];
  rows.forEach(r => { if (r.ayah) flat.push({ayah: r.ayah}); else r.s.forEach(s => flat.push(s)); });
  const hits = new Set(), show = new Set();
  flat.forEach((x, i) => { if (x.id && hitFn(x)) { hits.add(x.id); for (const j of [i - 1, i, i + 1]) if (flat[j] && flat[j].id) show.add(j); } });
  if (!hits.size) return null;
  let h = '', last = -2;
  flat.forEach((x, i) => {
    if (!show.has(i)) return;
    if (i !== last + 1 && last >= 0) h += '<div class="gap">…</div>';
    h += `<p class="para ar" style="margin:0">${sentHtml(x, {hit: hits})}</p>`;
    last = i;
  });
  return {html: h, n: hits.size};
}
function fullUnit(rows) {
  return rows.map(r => r.ayah ? `<p class="ayahline ar">﴿${esc(r.ayah)}﴾ <span class="small muted" dir="ltr">(baskının âyet satırı)</span></p>`
    : `<p class="para ar">${r.s.map(s => sentHtml(s)).join(' ')}</p>`).join('');
}
function tefsirHtml() {
  const foc = focusSids(), cid = CHIP[st.loc] ? st.loc : null;
  const hitFn = s => foc.has(s.id) || (cid && chipIn(s.t, cid));
  let h = `<h3>Müfessirler <span class="muted">vefat sırasıyla; bu âyetleri işleyen birimleri.${st.lang === 'tr'
    ? ' Türkçeleri henüz yok.' : ''}${cid ? ' Kelimenin geçtiği cümleler, birer cümle bağlamla.' : ''}</span></h3>`;
  for (const w of DATA.tefsir) {
    let parts = [], total = 0;
    for (const u of w.units) {
      const ex = excerpt(u.rows, hitFn);
      if (ex) total += ex.n;
      const pr = u.printed ? ` · baskı ${u.printed.volume}/${u.printed.page}` : '';
      parts.push(`<div class="ctx"><div class="small muted">${esc(u.verses)}${pr}</div>${ex ? ex.html : ''}
        <details${ex ? '' : ' open'}><summary class="small muted">birimin tamamı</summary>${fullUnit(u.rows)}</details></div>`);
    }
    const open = total > 0 && (cid || foc.size);
    h += `<details class="wk"${open ? ' open' : ''}><summary><b>${esc(w.author)}</b> · ${esc(w.title)}
      <span class="muted">${total ? `${total} cümle` : ''}</span></summary>${parts.join('')}</details>`;
  }
  return h;
}

function blocksAt(dk) {
  const d = DATA.drafts[dk];
  const pairOf = b => ({ar: b, tr: d.blocks.find(x => x.a === b.a.replace('/ar/', '/tr/'))});
  if (st.loc === 'L:tumu') return d.blocks.filter(b => b.l === 'ar').map(pairOf);
  const want = new Set(st.dfocus && st.dfocus.dk === dk ? st.dfocus.a : []);
  // bu yerdeki maddelerin bağlandığı paragraflar da (konu başka bir paragrafın içinde işlenmiş olabilir)
  const yd = Y.drafts[dk] || {rows: {}, extras: []};
  for (const [id] of itemsAt(st.loc)) for (const m of Y.models) for (const a of ((yd.rows[id] || {})[m] || {}).a || []) want.add(a);
  for (const f of yd.extras.filter(at)) f.a.forEach(a => want.add(a));
  for (const n of ((Y.critic[dk] || {}).notes || []).filter(at)) want.add(n.a);
  for (const x of bkAll().filter(x => x.t === dk && at(x))) want.add(x.a);
  for (const a of [...want]) want.add(a.replace('/tr/', '/ar/'));
  return d.blocks.filter(b => b.l === 'ar' && (want.has(b.a) || (d.heads[b.a] || []).includes(st.loc))).map(pairOf);

  const found = items.filter(id => Y.models.some(m => ((yd.rows[id] || {})[m] || {}).d && FOUNDISH.includes(yd.rows[id][m].d)));
  const extras = (yd.extras || []).filter(f => f.a.some(a => as.has(a)));
  const all = ((Y.critic[dk] || {}).notes || []).filter(n => as.has(n.a));
  const notes = all.filter(n => n.c !== 'kapali'), knotes = all.filter(n => n.c === 'kapali');

  const df = st.dfocus && st.dfocus.dk === dk ? st.dfocus : null;
  const dfHit = df && df.a.some(a => a.replace('/tr/', '/ar/') === key);
  const focused = dfHit || (st.focus && st.focus.item && A.items.includes(st.focus.item)) ||
    (st.focus && st.focus.extra && A.extras.some(f => f.k === st.focus.extra));
  let cls = '';
  if (L.karsi) cls = A.extras.some(f => f.c) ? ' contra' : A.found.length ? ' found' : A.extras.length ? ' extra' : '';
  const prim = st.lang === 'tr' && pair.tr ? pair.tr : pair.ar, sec = prim === pair.ar ? pair.tr : pair.ar;
  const q = dfHit ? df.q : null;
  const body = b => draftText(b.t, dk, b.l, q);
  const lab = b => b.l === 'tr' ? '<span class="tag ai">yapay zekâ tercümesi</span> ' : '';
  const marks = [];
  if (L.karsi && (A.items.length || A.extras.length))
    marks.push(mkr(p, key, 'karsi', `İşârât: ${A.found.length}/${A.items.length} nükte` + (A.extras.length ? ` · ${A.extras.length} fazla` : ''),
      'Karşılaştırıcıların bu paragrafa bağladığı İşârât nükteleri (bulunan/hepsi) ve İşârât\'ta karşılığı olmayan iddialar'));
  if (L.critic && A.notes.length) marks.push(mkr(p, key, 'critic', `● ${A.notes.length} not`, 'Eleştirmenin (açık kitap) bu paragrafa notları'));
  if (L.kcritic && A.knotes.length) marks.push(mkr(p, key, 'kcritic', `◆ ${A.knotes.length} kapalı`, 'Kapalı kitap eleştirmenin bu paragrafa notları'));
  if (L.bk && A.bks.length) marks.push(mkr(p, key, 'bk', `? ${A.bks.length} madde`, 'Bilirkişi soruları'));
  let opened = '';
  if (L.karsi && p.open[key + '|karsi'])
    opened += A.items.map((id, j) => itemCard(id, Y.items[id], `Nükte ${j + 1}/${A.items.length}`)).join('') +
              A.extras.map((f, j) => extraCard(f, `Fazla ${j + 1}/${A.extras.length}`)).join('');
  if (L.critic && p.open[key + '|critic']) opened += A.notes.map((n, j) => noteCard(dk, n, `Not ${j + 1}/${A.notes.length}`)).join('');
  if (L.kcritic && p.open[key + '|kcritic']) opened += A.knotes.map((n, j) => noteCard(dk, n, `Kapalı not ${j + 1}/${A.knotes.length}`)).join('');
  if (L.bk && p.open[key + '|bk']) opened += A.bks.map(x => bkCard(x)).join('');
  return `<div class="blk${focused ? ' focus' : ''}${pair.ar.q ? ' quote' : ''}${cls}" data-anchor="${esc(key)}">
    <div class="bhead"><span class="small muted">${SEC[key.split('/')[0]] || ''}${pair.ar.q ? ' · kaynaktan alıntı' : ''}</span><span class="mkrs">${marks.join('')}</span></div>
    <div class="${prim.l === 'ar' ? 'ar' : 'serif'}">${lab(prim)}${body(prim)}</div>
    ${sec ? `<details${q && !locate(prim.t, q) ? ' open' : ''}><summary class="small muted">${sec.l === 'ar' ? 'Arapçası (taslağın aslı)' : 'Türkçesi (yapay zekâ tercümesi)'}</summary>
      <div class="${sec.l === 'ar' ? 'ar' : 'serif'}">${body(sec)}</div></details>` : ''}
    ${pair.tr && pair.tr.iz ? `<div class="izah"><span class="tag ai">yapay zekâ izahı (günümüz Türkçesi)</span> ${esc(pair.tr.iz)}</div>` : ''}
    ${opened ? `<div class="opened">${opened}</div>` : ''}</div>`;
}
function missingHtml(dk) {
  const yd = Y.drafts[dk];
  if (!yd) return `<p class="empty small">Bu taslak İşârât'la karşılaştırılmadı.</p>`;
  const miss = itemsAt(st.loc).filter(([id]) => { const row = yd.rows[id] || {}; return !Y.models.some(m => row[m] && FOUNDISH.includes(row[m].d)); });
  if (!miss.length) return '';
  return `<h3>İşârât'ın bu yerdeki nükteleri: bu taslakta bulunmayanlar <span class="muted">${miss.length}; okuyucuların hiçbiri "aynen" ya da "kısmen" demedi</span></h3>` +
    miss.map(([id, it], j) => `<details class="wk"><summary><button class="linkish" data-focusitem="${id}" title="İşârât'taki cümlesi Kaynaklar yanında sarı olur">${esc(it.n)}</button></summary>${itemCard(id, it, `Kaçırılan ${j + 1}/${miss.length}`)}</details>`).join('');
}
function criticSummary(dk) {
  const c = Y.critic[dk];
  if (!c) return `<p class="empty small">Bu taslağın eleştirisi yok.</p>`;
  const gen = c.notes.filter(x => x.c !== 'kapali' && x.a === 'genel' && at(x));
  const done = x => (yzSuz[`${U}|${dk}|${x.k}`] || {}).v;
  return (gen.length ? `<h3>Eleştirmenin bütün taslağa notları <span class="muted">${gen.length}</span></h3>${gen.map((x, i) => noteCard(dk, x, `Genel ${i + 1}/${gen.length}`)).join('')}` : '') +
    `<details><summary class="small"><b>Eleştirmenin özeti, sistemli zaafları ve önerileri</b> · bütün notları yerlerine göre</summary>
    ${c.ozet ? `<p class="serif small">${codes(c.ozet)}</p>` : ''}
    ${c.sistemli.length ? `<ul class="small">${c.sistemli.map(s => `<li>${codes(s.metin)}</li>`).join('')}</ul>` : ''}
    ${c.oneriler.length ? `<p class="small"><b>Öneriler</b></p><ul class="small">${c.oneriler.map(o => `<li>${codes(o)}</li>`).join('')}</ul>` : ''}
    ${locIndex(c.notes.filter(x => x.c !== 'kapali'), done)}</details>`;
}
function kapaliSummary(dk) {
  const c = Y.critic[dk], k = c && c.kapali;
  if (!k) return `<p class="empty small">Bu taslağın kapalı kitap eleştirisi yok.</p>`;
  const notes = c.notes.filter(x => x.c === 'kapali'), gen = notes.filter(x => x.a === 'genel' && at(x));
  const done = x => (yzSuz[`${U}|${dk}|${x.k}`] || {}).v;
  const oz = typeof k.ozet === 'string' ? [['', k.ozet]] : Object.entries(k.ozet || {});
  return (gen.length ? `<h3>Kapalı kitap eleştirmenin bütün taslağa notları <span class="muted">${gen.length}</span></h3>${gen.map((x, i) => noteCard(dk, x, `Genel ${i + 1}/${gen.length}`)).join('')}` : '') +
    `<details><summary class="small"><b>Kapalı kitap eleştirmenin özeti ve sistemli zaafları</b> · bütün notları yerlerine göre</summary>
    ${oz.map(([b, t]) => `<p class="serif small">${b ? `<b>${esc(SEC[b] || b)}:</b> ` : ''}${codes(t)}</p>`).join('')}
    ${k.sistemli.length ? `<ul class="small">${k.sistemli.map(s => `<li>${s.bolum ? `<b>${esc(SEC[s.bolum] || s.bolum)}:</b> ` : ''}${codes(s.metin)}</li>`).join('')}</ul>` : ''}
    ${locIndex(notes, done)}</details>`;
}
function draftPane(p) {
  const dk = p.d, L = p.L;
  let h = '';
  if (st.srcbox && !panes.some(q => q.k === 'src')) h += srcBoxHtml();
  const lists = (L.karsi ? sampleBox() : '') + (L.critic ? critBox() + sysBox() : '') + (L.bk ? bkBox() : '');
  if (lists) h += `<details class="lists"><summary class="small muted">İşaretleme listeleri (örneklemler, sistemli başlıklar, bilirkişi maddeleri)</summary>${lists}</details>`;
  if (L.karsi) h += `<div class="legend small"><span class="lg found">İşârât'ta karşılığı var</span><span class="lg contra">İşârât'la çelişebilir</span><span class="lg extra">karşılığı yok (fazla)</span></div>`;
  const pairs = blocksAt(dk);
  h += pairs.length ? pairs.map(pr => blockHtml(dk, pr, p)).join('')
    : `<p class="empty">Bu taslakta bu yere ait paragraf yok. Üstteki "Metinlerin tamamı" ile bütününe bakabilirsiniz.</p>`;
  if (L.karsi) h += missingHtml(dk);
  if (L.critic) h += criticSummary(dk);
  if (L.kcritic) h += kapaliSummary(dk);
  return h;
}
function layerCount(dk, k) {
  if (!st.loc) return '';
  if (k === 'karsi') return Y.drafts[dk] ? itemsAt(st.loc).length : '–';
  if (k === 'critic') return Y.critic[dk] ? Y.critic[dk].notes.filter(n => n.c !== 'kapali' && at(n)).length : '–';
  if (k === 'kcritic') return Y.critic[dk] && Y.critic[dk].kapali ? Y.critic[dk].notes.filter(n => n.c === 'kapali' && at(n)).length : '–';
  return bkAll().filter(x => x.t === dk && at(x)).length;
}
function paneHead(i, p) {
  const opt = (v, l) => `<option value="${v}"${(p.k === 'draft' ? 'd:' + p.d : p.k) === v ? ' selected' : ''}>${l}</option>`;
  const opts = opt('src', 'Kaynaklar') + opt('isarat', "İşârât'ın metni") +
    `<optgroup label="Yapay zekâ taslakları">${draftOrder().map(dk => opt('d:' + dk, esc(draftLabel(dk)) + (draftAbout(dk) ? ' · ' + esc(draftAbout(dk)) : ''))).join('')}</optgroup>`;
  const tag = p.k === 'draft' ? '<span class="tag ai">yapay zekâ taslağı, tefsir değildir</span>' : '<span class="tag src">kaynakların metni</span>';
  const lay = p.k === 'draft' ? `<span class="layers">${LAYERS.map(([k, l]) =>
    `<label class="small"><input type="checkbox" data-layer="${k}" ${p.L[k] ? 'checked' : ''}> ${l} <span class="muted">${layerCount(p.d, k)}</span></label>`).join('')}</span>` : '';
  return `<div class="ph"><select data-panekind title="Bu yanda ne dursun">${opts}</select>${tag}
    ${st.loc ? `<span class="where">${locName(st.loc)}</span>` : ''}<span class="spacer"></span>
    ${panes.length > 1 ? '<button class="btn x" data-closepane title="Bu yanı kapat">✕</button>' : ''}${lay}</div>`;
}
function paneBody(p) {
  if (!st.loc) return p.k === 'draft' ? `<p class="empty">Önce âyetten bir yer seçin.</p>` : welcome() + CREDITS;
  if (p.k === 'src') return srcBoxHtml() + isaratHtml() + tefsirHtml() + klasikHtml() + risaleHtml() + CREDITS;
  if (p.k === 'isarat') return isaratHtml();
  return withDraft(p.d, () => draftPane(p));
}
function renderPanes(resetPane) {
  const box = $('#panes');
  const scroll = [...box.querySelectorAll('.pane')].map(x => x.scrollTop);
  box.style.setProperty('--n', panes.length);
  box.innerHTML = panes.map((p, i) => `<section class="pane ${p.k}" data-pane="${i}">${paneHead(i, p)}${paneBody(p)}</section>`).join('');
  box.querySelectorAll('.pane').forEach((x, i) => { if (scroll[i] && i !== resetPane) x.scrollTop = scroll[i]; });
  $('#addpane').disabled = panes.length >= MAXP;
}

function progress() {
  const n1 = Object.keys(yzEval).filter(k => k.startsWith(U + '|')).length;
  const n2 = Object.keys(yzSuz).filter(k => k.startsWith(U + '|')).length;
  const n3 = Object.entries(bkMarks).filter(([k, v]) => k.startsWith(U + '|') && v.v).length;
  const ns = (Y.sample || []).filter(x => sampleDone(x.key)).length;
  const nc = (Y.critic_sample || []).filter(x => (yzSuz[`${U}|${x.t}|${x.k}`] || {}).v).length;
  const nz = (Y.systemic || []).filter(z => (yzSuz[`${U}|sistemli|${z.id}`] || {}).v).length;
  $('#progress').textContent = `İşaretler: örneklem ${ns}/${(Y.sample || []).length} · karşılaştırma ${n1} · eleştiri örneklemi ${nc}/${(Y.critic_sample || []).length} · başlık ${nz}/${(Y.systemic || []).length} · eleştiri ${n2} · bilirkişi ${n3}/${bkAll().length}`;
}
function render() {
  $('#farklar').innerHTML = (DATA.fark || []).map(f => { const m = f.match(/-(\d+)-(\d+)\.html$/);
    return `<a class="btn" style="text-decoration:none;color:var(--fg)" href="${esc(f)}">Fark okuması: taslak ${m ? m[1] + ' ile ' + m[2] : f}</a>`; }).join(' ');
  $('#unit').innerHTML = (DATA.units || [{unit: U, title: DATA.title}]).map(u =>
    `<option value="${esc(u.unit)}"${u.unit === U ? ' selected' : ''}>${esc(u.title)}</option>`).join('');
  document.querySelectorAll('#lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === st.lang));
  $('#blind').checked = st.blind;
  document.body.classList.toggle('sel', !!st.loc);
  renderAyah(); renderPanes(); progress(); persist();
  document.documentElement.style.setProperty('--head-h', $('#hdr').offsetHeight + 'px');
}

// ================================================================ olaylar
const paneOf = el => { const x = el.closest('[data-pane]'); return x ? +x.dataset.pane : -1; };
function scrollIn(i, sel) {
  const pane = document.querySelector(`#panes [data-pane="${i}"]`), el = pane && pane.querySelector(sel);
  if (el) el.scrollIntoView({block: 'center', behavior: 'smooth'});
  return !!el;
}
function scrollKind(kinds, sel) { let any = false; panes.forEach((p, i) => { if (kinds.includes(p.k)) any = scrollIn(i, sel) || any; }); return any; }
// Bir taslağı gösteren yan: varsa o, yoksa ilk taslak yanı ona döner, o da yoksa yeni yan açılır
function paneFor(dk, layer) {
  let i = panes.findIndex(p => p.k === 'draft' && p.d === dk);
  if (i < 0) {
    i = panes.findIndex(p => p.k === 'draft');
    if (i >= 0) { panes[i].d = dk; panes[i].open = {}; }
    else if (panes.length < MAXP) { panes.push(newDraftPane(dk)); i = panes.length - 1; }
    else { i = panes.length - 1; panes[i] = newDraftPane(dk); }
  }
  if (layer) panes[i].L[layer] = true;
  savePanes(); return i;
}
function openRowAnchors(p, id, extraKey) {
  const yd = Y.drafts[p.d] || {rows: {}, extras: []};
  const as = extraKey ? ((yd.extras || []).find(f => f.k === extraKey) || {a: []}).a
                      : Y.models.flatMap(m => ((yd.rows[id] || {})[m] || {}).a || []);
  as.map(a => a.replace('/tr/', '/ar/')).forEach(a => { p.open[a + '|karsi'] = true; });
  return as.length > 0;
}
function focusItem(id) {
  const it = Y.items[id];
  if (!at({loc: it.loc})) st.loc = it.loc[0];
  st.focus = {sids: it.sids, item: id}; st.dfocus = null;
  panes.forEach(p => { if (p.k === 'draft' && openRowAnchors(p, id)) p.L.karsi = true; });
  render(); scrollKind(['src', 'isarat'], '.s.focus'); scrollKind(['draft'], '.blk.focus');
}
function setLoc(l) { st.loc = l; st.focus = null; st.dfocus = null; panes.forEach(p => { p.open = {}; }); render(); }

document.addEventListener('click', ev => {
  const t = ev.target;
  if (t.closest('#addpane')) {
    if (panes.length >= MAXP) { say(`En çok ${MAXP} yan.`); return; }
    const used = new Set(panes.filter(p => p.k === 'draft').map(p => p.d));
    const dk = draftOrder().find(k => !used.has(k)) || draftOrder()[0];
    panes.push(panes.some(p => p.k === 'src') ? newDraftPane(dk) : {k: 'src', open: {}});
    savePanes(); render(); return;
  }
  const cp = t.closest('[data-closepane]');
  if (cp) { panes.splice(paneOf(cp), 1); savePanes(); render(); return; }
  const loc = t.closest('[data-loc]');
  if (loc) { setLoc(loc.dataset.loc); return; }
  const om = t.closest('[data-openmk]');
  if (om) { const p = panes[paneOf(om)], k = om.dataset.openmk; p.open[k] = !p.open[k]; renderPanes(); return; }
  const fi = t.closest('[data-focusitem]');
  if (fi) { focusItem(fi.dataset.focusitem); return; }
  const s = t.closest('.pane.src .s[data-sid], .pane.isarat .s[data-sid]');
  if (s) {                                      // İşârât cümlesi -> taslak yanlarında ona bağlı paragraflar
    const sid = s.dataset.sid;
    const hit = Object.entries(Y.items).filter(([, it]) => it.sids.includes(sid));
    if (!hit.length) { say('Bu cümleye bağlı bir İşârât nüktesi yok.'); return; }
    const [id] = hit.find(([, it]) => at({loc: it.loc})) || hit[0];
    if (!panes.some(p => p.k === 'draft')) paneFor(DKEYS[DKEYS.length - 1], 'karsi');
    focusItem(id); return;
  }
  const sd = t.closest('[data-showdraft]');
  if (sd) {                                     // "taslakta göster"
    const here = paneOf(sd), dk = sd.dataset.draftgo2 || (panes[here] || {}).d || DKEYS[0];
    const i = paneFor(dk);
    st.dfocus = {dk, a: sd.dataset.showdraft.split(',').filter(Boolean), q: sd.dataset.quote};
    render(); scrollIn(i, '.blk.focus'); return;
  }
  const dg = t.closest('[data-draftgo]');
  if (dg) {                                     // kartın şeridinde başka taslak: bu yan o taslağa döner
    const i = paneOf(dg); if (i < 0) return;
    panes[i].d = dg.dataset.draftgo; panes[i].open = {};
    if (st.focus && st.focus.item) openRowAnchors(panes[i], st.focus.item);
    savePanes(); renderPanes(i); scrollIn(i, '.blk.focus'); return;
  }
  const sg = t.closest('[data-sidgo]');
  if (sg) {
    st.focus = {sids: [sg.dataset.sidgo]};
    if (!panes.some(p => p.k === 'src' || p.k === 'isarat') && panes.length < MAXP) { panes.unshift({k: 'src', open: {}}); savePanes(); }
    renderPanes();
    if (!scrollKind(['src', 'isarat'], '.s.focus')) say('Bu dayanak açık yanlardaki kaynaklarda yok: ' + sg.dataset.sidgo);
    return;
  }
  const mk = t.closest('.mk[data-src]');
  if (mk) {                                     // taslağın kaynak numarası: metni Kaynaklar yanının başında
    st.srcbox = {dk: mk.dataset.draft, n: mk.dataset.src};
    const s2 = DATA.drafts[st.srcbox.dk].sources[st.srcbox.n];
    st.focus = s2 && s2.i ? {sids: [s2.i]} : null;
    if (!panes.some(p => p.k === 'src') && panes.length < MAXP) { panes.unshift({k: 'src', open: {}}); savePanes(); }
    renderPanes();
    panes.forEach((p, i) => { if (p.k === 'src') { const el = document.querySelector(`#panes [data-pane="${i}"]`); if (el) el.scrollTop = 0; } });
    return;
  }
  if (t.closest('[data-closesrc]')) { st.srcbox = null; renderPanes(); return; }
  const fb = t.closest('[data-fold]');
  if (fb) { const p = panes[paneOf(fb)] || {}; withDraft(p.d || st.draft, () => setFold([fb.dataset.fold], !isFolded(fb.dataset.fold))); renderPanes(); return; }
  const cg = t.closest('[data-critgo]');
  if (cg) {
    const [dk, k] = cg.dataset.critgo.split('|'), x = Y.critic_sample.find(y => y.t === dk && y.k === k);
    const i = paneFor(dk, 'critic'), n = critNote(x) || {};
    st.loc = x.loc[0]; st.focus = null; st.dfocus = null;
    if (n.a && n.a !== 'genel') panes[i].open[n.a.replace('/tr/', '/ar/') + '|critic'] = true;
    withDraft(dk, () => setFold(['not:' + k], false));
    render(); scrollIn(i, `[data-not="${CSS.escape(U + '|' + dk + '|' + k)}"]`); return;
  }
  const sg2 = t.closest('[data-samplego]');
  if (sg2) {                                    // örneklemin satırına git: taslak, yer, kart açık ve vurgulu
    const x = Y.sample.find(y => y.key === sg2.dataset.samplego);
    const i = paneFor(x.t, 'karsi');
    st.loc = x.loc[0]; st.dfocus = null;
    if (x.m === 'fazla') { withDraft(x.t, () => setFold(['fazla:' + x.id], false)); st.focus = {extra: x.id, sids: []}; openRowAnchors(panes[i], null, x.id); }
    else { withDraft(x.t, () => setFold([x.id], false)); st.focus = {sids: Y.items[x.id].sids, item: x.id}; openRowAnchors(panes[i], x.id); }
    render(); scrollIn(i, '.card.focus'); scrollKind(['src', 'isarat'], '.s.focus'); return;
  }
  const bg = t.closest('[data-bkgo]');
  if (bg) {
    const [p2, id] = bg.dataset.bkgo.split('|'), x = Y.bilirkisi[p2].find(y => y.id === id);
    const i = paneFor(x.t, 'bk');
    st.loc = x.loc[0]; st.focus = null; st.dfocus = null;
    panes[i].open[x.a.replace('/tr/', '/ar/') + '|bk'] = true;
    withDraft(x.t, () => setFold([`bk:${p2}|${id}`], false));
    render(); scrollIn(i, `[data-bk="${CSS.escape(U + '|' + p2 + '|' + id)}"]`); return;
  }
  const yv = t.closest('[data-yzv]'), sv = t.closest('[data-suz]'), bv = t.closest('[data-bkv]');
  if (yv || sv) {
    if (needReader()) return;
    const box = (yv || sv).parentElement, k = yv ? box.dataset.yzvk : box.dataset.suzk, v = yv ? yv.dataset.yzv : sv.dataset.suz;
    const map = yv ? yzEval : yzSuz;
    if ((map[k] || {}).v === v) delete map[k]; else map[k] = {v, reader: reader(), at: new Date().toISOString()};
    store.set(yv ? 'd1-yz-sinama' : 'd1-yz-suzgec', map);
    progress(); renderPanes(); return;
  }
  if (bv) { const box = bv.closest('[data-bk]'), cur = (bkMarks[box.dataset.bk] || {}).v; bkSave(box, {v: cur === bv.dataset.bkv ? '' : bv.dataset.bkv}); return; }
});
document.addEventListener('toggle', ev => {
  if (ev.target.id === 'smpbox') store.set('d1-masa-orneklem-acik', ev.target.open);
  if (ev.target.id === 'bkbox') store.set('d1-masa-bk-acik', ev.target.open);
  if (ev.target.id === 'critbox') store.set('d1-masa-crit-acik', ev.target.open);
  if (ev.target.id === 'sysbox') store.set('d1-masa-sys-acik', ev.target.open);
}, true);
function bkSave(box, patch) {
  if (needReader()) return false;
  const key = box.dataset.bk, m = Object.assign({}, bkMarks[key] || {}, patch, {reader: reader(), at: new Date().toISOString()});
  if (m.dt === 'yz') m.v = 'emin_degilim';
  bkMarks[key] = m; store.set('d1-bilirkisi', bkMarks);
  box.querySelectorAll('[data-bkv]').forEach(x => x.setAttribute('aria-pressed', m.v === x.dataset.bkv));
  const head = box.querySelector('.head .marks'); if (head) head.innerHTML = bkMark(m);
  progress(); return true;
}
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'unit') { if (t.value !== U) { st.loc = null; persist(); location.href = t.value + '.html'; } return; }
  if (t.id === 'blind') { st.blind = t.checked; persist(); render(); return; }
  if (t.matches('[data-panekind]')) {
    const i = paneOf(t), v = t.value;
    panes[i] = v.startsWith('d:') ? Object.assign(newDraftPane(v.slice(2)), panes[i].k === 'draft' ? {L: panes[i].L} : {}) : {k: v, open: {}};
    savePanes(); renderPanes(i); return;
  }
  if (t.matches('[data-layer]')) { const p = panes[paneOf(t)]; p.L[t.dataset.layer] = t.checked; savePanes(); renderPanes(); return; }
  if (t.id === 'onlysmp') { st.onlySample = t.checked; renderPanes(); persist(); return; }
  const f = t.closest('[data-bkf]');
  if (f) { const box = f.closest('[data-bk]'); if (bkSave(box, {[f.dataset.bkf]: f.value}) && f.dataset.bkf === 'dt') renderPanes(); }
});

document.querySelectorAll('#lang button').forEach(b => b.onclick = () => { st.lang = b.dataset.v; render(); });
$('#reader').value = store.get('d1-okuma-okur', '');
$('#logout').hidden = !location.pathname.startsWith('/taslak/');
if (location.pathname.startsWith('/taslak/')) {
  fetch('/taslak/ben', {credentials: 'same-origin', cache: 'no-store'}).then(r => r.ok ? r.json() : null).then(j => {
    if (!j || !j.name) return;
    ACCOUNT = j.name;
    $('#readerw').hidden = true; $('#who').hidden = false; $('#who').textContent = `Okuyucu: ${j.name}`;
    $('#who').title = j.email;
  }).catch(() => {});
}
$('#reader').onchange = () => store.set('d1-okuma-okur', reader());

// --- dışa ve içe aktarma: eski okuma sayfasıyla aynı dosya (notlar ve ölçütler de içinde, değiştirilmeden)
$('#export').onclick = () => {
  const r = reader() || 'okuyucu', rubric = store.get('d1-okuma-olcut', {});
  const payload = {app: 'd1-okuma', version: 1, reader: r, exported_at: new Date().toISOString(), notes: store.get('d1-okuma-notlar', []),
    yz_sinama: yzEval, yz_suzgec: yzSuz, bilirkisi: bkMarks,
    rubric: Object.entries(rubric).map(([k, v]) => { const [unit, draft, rd] = k.split('|'); return {unit, draft, reader: rd, scores: v}; })};
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 1)], {type: 'application/json'}));
  a.download = `d1-notlar-${r.replace(/[^\p{L}\p{N}]+/gu, '-')}-${new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '')}.json`;
  a.click(); URL.revokeObjectURL(a.href); say('İşaretler dışa aktarıldı.');
};
$('#import').onchange = async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try {
    const p = JSON.parse(await f.text());
    if (p.app !== 'd1-okuma') throw new Error('bu sayfanın dosyası değil');
    for (const [src, map, key] of [[p.yz_sinama, yzEval, 'd1-yz-sinama'], [p.yz_suzgec, yzSuz, 'd1-yz-suzgec'], [p.bilirkisi, bkMarks, 'd1-bilirkisi']]) {
      for (const [k, v] of Object.entries(src || {})) if (!map[k] || v.at > map[k].at) map[k] = v;
      store.set(key, map);
    }
    const notes = store.get('d1-okuma-notlar', []);
    for (const n of p.notes || []) { const i = notes.findIndex(x => x.id === n.id); if (i < 0) notes.push(n); else if (n.at > notes[i].at) notes[i] = n; }
    store.set('d1-okuma-notlar', notes);
    render(); say('İşaretler içe aktarıldı.');
  } catch (e) { say('İçe aktarılamadı: ' + e.message); }
  ev.target.value = '';
};
window.addEventListener('resize', () => document.documentElement.style.setProperty('--head-h', $('#hdr').offsetHeight + 'px'));
render();
</script></body></html>
