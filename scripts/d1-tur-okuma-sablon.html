<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tur Okuması</title>
<style>
:root { --bg: #fbfaf7; --fg: #1d1d1b; --muted: #6b6a66; --line: #dcd8cf; --card: #ffffff; --soft: #f3f1ec;
        --accent: #1f5c3f; --accent-soft: #e2efe7; --ai: #5a4a8a; --ai-soft: #eeebf7;
        --bad: #a3271f; --src: #1f4f7a; --src-soft: #e3eef8; --warn-soft: #fdf0dc; --q: #f6f2e8; --diff: #fbe38a; --diff-fg: #1d1d1b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161614; --fg: #e8e6e1; --muted: #9c9a94; --line: #34332f; --card: #1f1e1b; --soft: #26251f;
  --accent: #7cc49d; --accent-soft: #1c3127; --ai: #b9a8ee; --ai-soft: #2a2540;
  --bad: #f08a80; --src: #8cc0ef; --src-soft: #18293a; --warn-soft: #3a2a14; --q: #24221c; --diff: #6b5810; --diff-fg: #fff6d6; } }
:root[data-theme="dark"] { --bg: #161614; --fg: #e8e6e1; --muted: #9c9a94; --line: #34332f; --card: #1f1e1b; --soft: #26251f;
  --accent: #7cc49d; --accent-soft: #1c3127; --ai: #b9a8ee; --ai-soft: #2a2540;
  --bad: #f08a80; --src: #8cc0ef; --src-soft: #18293a; --warn-soft: #3a2a14; --q: #24221c; --diff: #6b5810; --diff-fg: #fff6d6; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 system-ui, "Noto Sans", sans-serif; }
button, select, input, textarea { font: inherit; font-size: .85rem; color: var(--fg); }
.ar, .arw { font-family: "Noto Naskh Arabic", "Amiri", "Scheherazade New", serif; }
.ar { direction: rtl; text-align: right; font-size: 1.2rem; line-height: 2; }
.arw { font-size: 1.1em; }
.serif { font-family: "Noto Serif", "DejaVu Serif", Georgia, serif; font-size: 1rem; line-height: 1.7; }
.muted { color: var(--muted); } .small { font-size: .8rem; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
         padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
header h1 { font-size: 1rem; margin: 0; }
header label { font-size: .8rem; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
input, textarea { padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 3px 10px; cursor: pointer;
       text-decoration: none; color: var(--fg); font-size: .85rem; }
.btn:disabled { opacity: .45; cursor: default; }
.spacer { flex: 1; } .msg { font-size: .8rem; color: var(--bad); }
main { max-width: 1300px; margin: 0 auto; padding: 12px 16px 80px; }
.intro { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; margin-bottom: 14px; font-size: .88rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin: 0 0 22px; padding: 10px 14px; }
.card.done { border-color: var(--accent); }
.card h2 { font-size: 1rem; margin: 0 0 2px; }
.card .soru { font-size: .9rem; margin: 0 0 10px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.col { border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; background: var(--bg); min-width: 0; }
.col > h3 { margin: 0 0 4px; font-size: .95rem; color: var(--ai); }
.stat { font-size: .75rem; color: var(--muted); font-weight: normal; }
.blk { border-top: 1px dashed var(--line); padding: 6px 0; }
.blk:first-of-type { border-top: 0; }
.blk.quote { background: var(--q); border-left: 3px solid var(--line); padding: 4px 8px; margin: 4px 0; border-radius: 4px; }
.lab { font-size: .72rem; color: var(--muted); }
details > summary { cursor: pointer; }
mark.d { background: var(--diff); color: var(--diff-fg); border-radius: 2px; }
.mk { color: var(--src); font-size: .8em; cursor: help; }
.none { color: var(--muted); font-style: italic; padding: 8px 0; }
.ask { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.ask label { font-size: .88rem; display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
.ask textarea { width: 100%; min-height: 3.2em; }
.reveal { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; font-size: .88rem; }
.box { border-radius: 8px; padding: 6px 10px; margin: 6px 0; background: var(--soft); }
.box.isr { background: var(--src-soft); }
.box.env { background: var(--warn-soft); }
details.srcs { margin-top: 8px; }
details.srcs .box .ar { font-size: 1.05rem; }
.cols.c3 { grid-template-columns: 1fr 1fr 1fr; }
.ask .row { display: block; margin: 4px 0; }
@media (max-width: 820px) { .cols, .cols.c3 { grid-template-columns: 1fr; } }
</style></head>
<body>
<header>
  <h1>Tur okuması</h1>
  <span class="small muted" id="sub"></span>
  <label id="readerw">Okuyucu <input id="reader" size="10" placeholder="adınız"></label>
  <span id="who" class="small muted" hidden></span>
  <span class="spacer"></span>
  <span id="progress" class="small muted"></span>
  <button class="btn" id="bitir" hidden>Okumayı bitir</button>
  <button class="btn" id="export">Dışa aktar</button>
  <a class="btn" id="masa" href="./">Âyet masası</a>
  <span class="msg" id="msg"></span>
</header>
<main>
  <div class="intro" id="intro"></div>
  <div id="cards"></div>
</main>
<script>
const DATA = {data};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};
// işaretler masanın A/B kaydıyla ortak: "birim|tur|yer" -> {secim: taslak|esit|emin_degilim, harf, gerekce, acildi}
const KEY = 'd1-masa-ab';
let marks = store.get(KEY, {});
const kOf = c => `${DATA.unit}|${DATA.ad}|${c.id}`;
let ACCOUNT = null;
// S7.2: görevli sayfa (DATA.gorev): kararlar ar-ge masasının sunucusuna yazılır; kör okumada A ile B'nin hangi taslak
// olduğu sayfada yoktur, sunucudadır ve "Okumayı bitir"den sonra gelir (MAP). Görevsiz eski sayfalar eskisi gibi.
const API = '/taslak/api/';
let SERVER = false, MAP = null, DONE = false;
const BLIND = !!DATA.gorev && DATA.ab && !DATA.a;
const nameOf = l => BLIND ? (MAP ? MAP[l] : null) : (l === 'A' ? DATA.a : DATA.b);
const aboutOf = l => { const d = nameOf(l); return d ? ((MAP && MAP.about) || DATA.about || {})[d] || '' : ''; };
function reader() { return ACCOUNT || $('#reader').value.trim(); }
function say(t) { $('#msg').textContent = t; setTimeout(() => { $('#msg').textContent = ''; }, 4000); }
function save(c, patch) {
  marks = store.get(KEY, {});
  const k = kOf(c);
  marks[k] = Object.assign({}, marks[k] || {}, patch, {at: new Date().toISOString(), reader: reader()});
  if (!store.set(KEY, marks) && !SERVER) say('Tarayıcı işareti kaydedemedi; dışa aktarın.');
  if (SERVER) {
    const {reader: _r, ...body} = marks[k];
    fetch(`${API}okuma/${encodeURIComponent(DATA.gorev)}/karar/${encodeURIComponent(c.id)}`, {method: 'PUT',
      credentials: 'same-origin', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})
      .then(r => { if (!r.ok) say('Sunucuya kaydedilemedi; tarayıcıda duruyor.'); })
      .catch(() => say('Sunucuya kaydedilemedi; tarayıcıda duruyor.'));
  }
  progress();
}
const YETER = [['yeterli', 'Yeterli'], ['duzeltmeyle', 'Düzeltmeyle yeterli'], ['yetersiz', 'Yetersiz'], ['emin_degilim', 'Emin değilim']];
const AB = [['a', 'A daha iyi'], ['b', 'B daha iyi'], ['esit', 'Eşit'], ['emin_degilim', 'Emin değilim']];
const CHOICE = DATA.tek && !DATA.ab ? YETER : AB;
const val = v => DATA.tek && !DATA.ab ? v : BLIND ? (v === 'a' ? 'A' : v === 'b' ? 'B' : v)
                                                    : v === 'a' ? DATA.a : v === 'b' ? DATA.b : v;
const DURUM = {aynen: 'aynen buldu', kismen: 'kısmen buldu', farkli_gerekce: 'farklı gerekçeyle', yok: 'bulamadı'};

const AR = /[؀-ۿﭐ-﷿ﹰ-﻿]/;
const ARUN = /[؀-ۿﭐ-﷿ﹰ-﻿][؀-ۿﭐ-﷿ﹰ-﻿\s\-]*/g;
function inline(text, srcs, tr) {                     // [n] kaynağın adı üstünde; Türkçede Arapça ibare sağdan sola
  let s = esc(text);
  if (tr) s = s.replace(ARUN, m => `<bdi class="arw" dir="rtl">${m.trim()}</bdi>` + (/\s$/.test(m) ? ' ' : ''));
  return s.replace(/\[([^\]\n]{1,80})\]/g, (m, inner) => {
    const nums = inner.match(/\b\d+\b/g) || [];
    if (!nums.length) return m;
    return `<span class="mk" title="${esc(nums.map(n => `[${n}] ${srcs[n] ? srcs[n].c : ''}`).join(' | '))}">[${inner}]</span>`;
  }).replace(/\n/g, '<br>');
}
// --- sarı fark (yalnız D turu, `DATA.sari`): aynı taslağın iki sürümü; kelimeler sırayla (en uzun ortak dizi)
// eşlenir, öbür yanda karşılığı olmayan kelime sarıdır. Türkçe Türkçeyle, Arapça Arapçayla.
function norm(w) {
  if (/^\[[^\]]*\]$/.test(w)) return '';
  return w.replace(/[ً-ٰٟۖ-ۭـ«»"“”'’‘(),.:;؛،!?؟\[\]﴿﴾]/g, '');
}
function lcsMarks(A, B) {                             // A, B: [{p, k, n}] → [Set, Set] ("p:k" işaretlenecek)
  const n = A.length, m = B.length, L = Array.from({length: n + 1}, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i][j] = A[i].n === B[j].n ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const kA = new Set(), kB = new Set();
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (A[i].n === B[j].n) { kA.add(i); kB.add(j); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++;
  }
  return [new Set(A.filter((x, q) => !kA.has(q)).map(x => x.p + ':' + x.k)),
          new Set(B.filter((x, q) => !kB.has(q)).map(x => x.p + ':' + x.k))];
}
function toks(s, f) { const out = []; s.paras.forEach((p, i) => (p[f] || '').split(/(\s+)/).forEach((w, k) => { const n = w.trim() ? norm(w) : ''; if (n) out.push({p: i, k, n}); })); return out; }
function cardMarks(c) {
  if (!DATA.sari) return {A: {tr: new Set(), ar: new Set()}, B: {tr: new Set(), ar: new Set()}};
  const [tA, tB] = lcsMarks(toks(c.A, 'tr'), toks(c.B, 'tr')), [aA, aB] = lcsMarks(toks(c.A, 'ar'), toks(c.B, 'ar'));
  return {A: {tr: tA, ar: aA}, B: {tr: tB, ar: aB}};
}
function words(text, srcs, tr, mk, pi) {             // sarılı metin: kelime kelime, Türkçede Arapça öbek sağdan sola
  const W = text.split(/(\s+)/), one = (w, k) => {
    const ref = w.match(/^\[([^\]]+)\]([.,:;]*)$/);
    const h = ref ? `<span class="mk" title="${esc((ref[1].match(/\d+/g) || []).map(n => `[${n}] ${srcs[n] ? srcs[n].c : ''}`).join(' | '))}">${esc(w)}</span>` : esc(w);
    return mk.has(pi + ':' + k) ? `<mark class="d">${h}</mark>` : h;
  };
  const isAr = w => AR.test(w) && !/[A-Za-zÇĞİÖŞÜçğıöşüâîû]/.test(w);
  let out = '', run = null;
  const flush = () => { if (run !== null) { out += `<bdi class="arw" dir="rtl">${run.trim()}</bdi>` + (/\s$/.test(run) ? ' ' : ''); run = null; } };
  W.forEach((w, k) => {
    if (!w.trim()) { if (w.includes('\n')) { flush(); out += '<br>'; } else if (run !== null) run += w; else out += w; return; }
    if (tr && isAr(w)) { run = (run || '') + one(w, k); return; }
    flush(); out += one(w, k);
  });
  flush(); return out;
}
const arw = t => esc(t).replace(ARUN, m => `<bdi class="arw" dir="rtl">${m.trim()}</bdi>` + (/\s$/.test(m) ? ' ' : ''));   // başlık ve soruda Arapça öbek
function paraHtml(p, srcs, mk, pi) {
  const body = (t, tr, set) => DATA.sari ? words(t, srcs, tr, set, pi) : inline(t, srcs, tr);
  const lab = p.q ? '<div class="lab">kaynaktan alıntı</div>' : '';
  if (!p.tr) return `<div class="blk${p.q ? ' quote' : ''}">${lab}<div class="ar" dir="rtl">${body(p.ar, false, mk.ar)}</div>
    ${p.q ? '' : '<div class="small muted">(bu paragrafın Türkçesi taslakta yok)</div>'}</div>`;
  const arOpen = DATA.sari && [...mk.ar].some(x => x.startsWith(pi + ':')) && ![...mk.tr].some(x => x.startsWith(pi + ':'));
  // paragrafın devamı (`ek`): Türkçe parçalar ve Türkçe alıntılar sırayla; Arapça alıntılar Arapçanın yanında
  const ek = p.ek || [];
  const ekTr = ek.filter(e => e.l === 'tr').map(e => e.q
    ? `<div class="blk quote"><div class="lab">kaynaktan alıntı</div><div class="serif">${inline(e.t, srcs, true)}</div></div>`
    : `<div class="serif" style="margin-top:6px">${inline(e.t, srcs, true)}</div>`).join('');
  const ekAr = ek.filter(e => e.l === 'ar').map(e => `<div class="ar" dir="rtl" style="border-top:1px dashed var(--line)">${inline(e.t, srcs, false)}</div>`).join('');
  return `<div class="blk${p.q ? ' quote' : ''}">${lab}<div class="serif">${body(p.tr, true, mk.tr)}</div>${ekTr}
    ${p.ar ? `<details${arOpen ? ' open' : ''}><summary class="small muted">Arapçası (taslağın aslı)${DATA.sari && [...mk.ar].some(x => x.startsWith(pi + ':')) ? ' · değişiklik var' : ''}</summary><div class="ar" dir="rtl">${body(p.ar, false, mk.ar)}</div>${ekAr}</details>` : ''}</div>`;
}
function colHtml(lab, s, mk) {
  const body = s.paras.length ? s.paras.map((p, i) => paraHtml(p, s.sources, mk, i)).join('')
    : '<div class="none">Bu taslakta bu nükteyi işleyen paragraf yok.</div>';
  const srcs = Object.entries(s.sources);
  const sh = srcs.length ? `<details class="srcs"><summary class="small">Andığı kaynaklar (${srcs.length})</summary>` +
    srcs.map(([n, x]) => `<div class="box"><b>[${esc(n)}]</b> <span class="small">${esc(x.c)}</span>
      <div class="${AR.test(x.t) ? 'ar' : 'small'}" dir="auto">${esc(x.t) || '<span class="muted">(metin bulunamadı)</span>'}</div></div>`).join('') + '</details>' : '';
  return `<div class="col"><h3>${lab} <span class="stat">${s.paras.length} paragraf · ${s.words} kelime</span></h3>${body}${sh}</div>`;
}
// D15: tek taslak ve İşârât yan yana; aletlerin hükmü "Aç"tan sonra
const HUKUM = {dogru: 'doğru', asiyor: 'kaynağın sözünü aşıyor', kaynakta_yok: 'kaynakta yok', nisbet_yok: 'nisbet yok (istinbat)',
               nakil: 'kaynağın naklettiği', itiraz: 'kaynağın itirazı', reddedilen: 'kaynağın reddettiği'};
const TASLAKTA = {aynen: 'aynen', kismen: 'kısmen', baska_yoldan: 'başka yoldan', yok: 'yok'};
function isaratCol(c) {
  return `<div class="col"><h3>İşârât <span class="stat">bu yerdeki sözü</span></h3>
    ${c.isarat_tr ? `<div class="blk"><div class="small muted">Abdülmecid Nursî tercümesi</div><div class="serif">${esc(c.isarat_tr)}</div></div>` : ''}
    ${c.isarat_ar ? `<details${c.isarat_tr ? '' : ' open'}><summary class="small muted">Arapça aslı</summary><div class="ar" dir="rtl">${esc(c.isarat_ar)}</div></details>` : ''}</div>`;
}
function toolsHtml(c) {
  const labs = DATA.ab ? ['A', 'B'] : ['A'];
  const who = l => !DATA.ab ? '' : nameOf(l) ? `<b>${l}</b> = ${esc(nameOf(l))} (${esc(aboutOf(l))})`
                                             : `<b>${l}</b>: hangi taslak olduğu okumayı bitirince açılır`;
  const envOf = l => Object.entries((c.envanter || {})[l] || {}).map(([k, v]) => `${esc(k)}: ${esc(v.join(', '))}`).join(' · ');
  return `<div class="reveal">${DATA.ab ? `<div>${who('A')}</div><div>${who('B')}</div>` : ''}
    <div class="box env"><b>Neden seçildi:</b> ${esc(c.tur_ad)}. ${esc(c.acik || '')}</div>
    <div class="box isr"><div class="small muted">İşârât'ın nüktesi (envanterin özeti${c.lafiz ? ', ' + esc(c.lafiz) : ''})</div><div>${esc(c.nukte)}</div>
      ${labs.map(l => `<div class="small">Envanter okuyucusu ${DATA.ab ? l + "'da" : 'taslakta'}: ${envOf(l) || '—'}</div>`).join('')}</div>
    ${labs.map(l => sideTools(l, (c.araclar || {})[l] || {})).join('')}</div>`;
}
function sideTools(l, t) {
  const li = xs => xs.length ? `<ul>${xs.join('')}</ul>` : '<div class="small muted">Bu yer için bir şey demedi.</div>';
  return `${DATA.ab ? `<h3 style="margin:10px 0 2px">${l} için aletler</h3>` : ''}
    <div class="box"><b>İşârât karşılaştırması</b> (İşârât'ı okuyarak)
      ${li((t.isarat_nukte || []).map(x => `<li>Ana nükte, taslakta ${esc(TASLAKTA[x.taslakta] || x.taslakta)}: ${esc(x.nukte)}</li>`)
          .concat((t.isarat || []).map(x => `<li><b>${esc(x.tur)}</b> (${esc(x.oncelik || '')}): ${esc(x.metin)}</li>`)))}</div>
    <div class="box"><b>Kapalı eleştirmen</b> (İşârât'ı görmeden; D5'te bu çalışacak)
      ${li((t.kapali || []).map(x => `<li><b>${esc(x.tur)}</b> (${esc(x.oncelik || '')}): ${esc(x.metin)}</li>`))}</div>
    <div class="box"><b>Nisbet denetçisi</b>
      ${li((t.nisbet || []).map(x => `<li><b>${esc(HUKUM[x.hukum] || x.hukum)}</b>: «${esc(x.alinti || '')}» ${esc(x.gerekce)}</li>`))}</div>`;
}
function cardHtmlTek(c, idx) {
  const m = marks[kOf(c)] || {}, none = {ar: new Set(), tr: new Set()};
  const radios = (set, f, cur) => set.map(([v, l]) => `<label><input type="radio" name="c-${idx}-${f}" value="${esc(val(v))}" data-i="${idx}" data-f="${f}"${cur === val(v) ? ' checked' : ''}>${l}</label>`).join('');
  const cols = DATA.ab ? `<div class="cols c3">${colHtml('A', c.A, none)}${colHtml('B', c.B, none)}${isaratCol(c)}</div>`
                       : `<div class="cols">${colHtml('Taslak', c.A, none)}${isaratCol(c)}</div>`;
  const ask = DATA.ab
    ? `<div class="row"><b class="small">Hangisi daha iyi?</b> ${radios(AB, 'secim', m.secim)}</div>
       <div class="row"><b class="small">Daha iyi bulduğunuz bu yerde kendi başına yeterli mi?</b> ${radios(YETER, 'yeter', m.yeter)}</div>`
    : `<b class="small">Taslak bu yerde kendi başına yeterli mi?</b>${radios(YETER, 'secim', m.secim)}`;
  return `<div class="card${m.secim ? ' done' : ''}" id="card-${idx}">
    <h2>${idx + 1}. ${arw(c.baslik)}</h2><p class="soru">${arw(c.soru || '')}</p>
    ${cols}
    <div class="ask">${ask}
      <textarea data-i="${idx}" data-f="gerekce" placeholder="Kısa gerekçe (bir iki cümle)">${esc(m.gerekce || '')}</textarea>
      ${m.acildi ? '' : `<button class="btn" data-open="${idx}" ${m.secim ? '' : 'disabled'}>${DATA.ab ? "Aç: hangisi hangisi ve aletlerin dediği" : "Aç: aletlerin bu yer için dediği"}</button>`}
    </div>${m.acildi ? toolsHtml(c) : ''}</div>`;
}
function cardHtml(c, idx) {
  if (DATA.tek) return cardHtmlTek(c, idx);
  const m = marks[kOf(c)] || {}, M = cardMarks(c);
  const opts = CHOICE.map(([v, l]) => `<label><input type="radio" name="c-${idx}" value="${esc(val(v))}" data-i="${idx}" data-f="secim"${m.secim === val(v) ? ' checked' : ''}>${l}</label>`).join('');
  let rev = '';
  if (m.acildi) {
    const who = d => `${esc(d)} (${esc((DATA.about || {})[d] || '')})`;
    const dur = s => Object.values(s.durum || {}).map(d => DURUM[d] || d || 'bulamadı').join(', ') || 'bulamadı';
    rev = `<div class="reveal"><div><b>A</b> = ${who(DATA.a)}</div><div><b>B</b> = ${who(DATA.b)}</div>
      <div class="box env"><b>Neden seçildi:</b> ${esc(c.tur_ad)}. ${esc(c.acik || '')}
        <div class="small">Envanter okuyucusu bu nükteyi A'da ${esc(dur(c.A))}, B'de ${esc(dur(c.B))}.</div></div>
      <div class="box isr"><div class="small muted">İşârât'ın nüktesi (envanterin özeti${c.lafiz ? ', ' + esc(c.lafiz) : ''})</div><div>${esc(c.nukte)}</div>
        ${c.isarat_tr ? `<div class="small muted" style="margin-top:6px">İşârât'ın sözü (Abdülmecid Nursî tercümesi)</div><div class="serif">${esc(c.isarat_tr)}</div>` : ''}
        ${c.isarat_ar ? `<details><summary class="small muted">Arapçası</summary><div class="ar" dir="rtl">${esc(c.isarat_ar)}</div></details>` : ''}</div></div>`;
  }
  return `<div class="card${m.secim ? ' done' : ''}" id="card-${idx}">
    <h2>${idx + 1}. ${arw(c.baslik)}</h2><p class="soru">${arw(c.soru || '')}</p>${c.sinir_asimi ? `<p class="small muted">Bu kartta kelime sınırı aşıldı: ${esc(c.sinir_asimi)}</p>` : ''}
    <div class="cols">${colHtml('A', c.A, M.A)}${colHtml('B', c.B, M.B)}</div>
    <div class="ask"><b class="small">Hangisi daha iyi?</b>${opts}
      <textarea data-i="${idx}" data-f="gerekce" placeholder="Kısa gerekçe (bir iki cümle)">${esc(m.gerekce || '')}</textarea>
      ${m.acildi ? '' : `<button class="btn" data-open="${idx}" ${m.secim ? '' : 'disabled'}>Aç: hangisi hangisi, ölçüler ve İşârât</button>`}
    </div>${rev}</div>`;
}
function render() {
  $('#sub').textContent = `${DATA.title} · ${DATA.ad} · ${DATA.cards.length} yer · ≈${DATA.kelime} kelime, ≈${DATA.dakika} dk`;
  $('#intro').innerHTML = DATA.giris;
  $('#cards').innerHTML = DATA.cards.map(cardHtml).join('');
  progress();
}
function progress() {
  const n = DATA.cards.filter(c => (marks[kOf(c)] || {}).secim).length;
  $('#progress').textContent = `İşaretlenen: ${n}/${DATA.cards.length}` + (SERVER ? (DONE ? ' · bitti, sunucuda' : ' · sunucuya kaydediliyor') : '');
  const b = $('#bitir');
  b.hidden = !SERVER || DONE;
  b.disabled = n < DATA.cards.length;
}
$('#bitir').onclick = () => {
  const b = $('#bitir');
  if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Emin misiniz? Bitir'; return; }
  fetch(`${API}okuma/${encodeURIComponent(DATA.gorev)}/bitir`, {method: 'POST', credentials: 'same-origin'})
    .then(r => r.ok ? r.json() : Promise.reject(r.status)).then(t => {
      DONE = true; MAP = t.gizli || MAP; render(); say('Okuma bitti; sonuçlar sunucuda.');
    }).catch(() => say('Bitirilemedi; yeniden deneyin.'));
};
function loadServer() {
  if (!DATA.gorev || !location.protocol.startsWith('http')) return;
  fetch(`${API}okuma/${encodeURIComponent(DATA.gorev)}`, {credentials: 'same-origin', cache: 'no-store'})
    .then(r => r.ok ? r.json() : null).then(t => {
      if (!t) return;
      SERVER = true; DONE = t.durum === 'bitti'; MAP = t.gizli || null;
      marks = store.get(KEY, {});
      for (const c of DATA.cards) {
        const k = kOf(c), srv = (t.kararlar || {})[c.id];
        if (srv) marks[k] = Object.assign({}, marks[k] || {}, srv);
        else if (marks[k]) save(c, {});                 // sunucu yokken tarayıcıda kalmış işaret: sunucuya
      }
      store.set(KEY, marks);
      render();
    }).catch(() => {});
}
document.addEventListener('change', ev => {
  const t = ev.target, f = t.dataset.f;
  if (!f) return;
  const c = DATA.cards[+t.dataset.i];
  if (!reader()) { say('Önce okuyucu adınızı yazın.'); if (t.type === 'radio') t.checked = false; $('#reader').focus(); return; }
  if (f === 'secim') {
    save(c, DATA.tek && !DATA.ab ? {secim: t.value} : BLIND ? {secim: t.value, harf: t.value}
         : {secim: t.value, harf: t.value === DATA.a ? 'A' : t.value === DATA.b ? 'B' : t.value});
    const card = t.closest('.card'); card.classList.add('done');
    const b = card.querySelector('[data-open]'); if (b) b.disabled = false;
  } else if (f === 'yeter') save(c, {yeter: t.value});
  else save(c, {gerekce: t.value});
});
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-open]');
  if (!b) return;
  const idx = +b.dataset.open, c = DATA.cards[idx];
  if (!(marks[kOf(c)] || {}).secim) return;
  save(c, {acildi: new Date().toISOString()});
  $(`#card-${idx}`).outerHTML = cardHtml(c, idx);
});
$('#export').onclick = () => {
  const ab = Object.fromEntries(DATA.cards.map(c => [kOf(c), marks[kOf(c)]]).filter(([, v]) => v));
  const out = {kind: DATA.tek ? 'd1-tur-okuma-tek' : 'd1-tur-okuma', unit: DATA.unit, tur: DATA.ad, a: nameOf('A'), b: nameOf('B'), reader: reader(),
               exported: new Date().toISOString(), ab};
  const blob = new Blob([JSON.stringify(out, null, 1)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `d1-tur-${DATA.unit}-${DATA.ad}-${reader() || 'okuyucu'}.json`;
  a.click(); URL.revokeObjectURL(a.href);
};
$('#masa').href = DATA.masa;
$('#reader').value = store.get('d1-okuma-okur', '') || '';
$('#reader').onchange = () => store.set('d1-okuma-okur', reader());
window.addEventListener('storage', ev => { if (ev.key === KEY) { marks = store.get(KEY, {}); render(); } });
if (location.protocol.startsWith('http')) {
  fetch('/taslak/ben', {credentials: 'same-origin', cache: 'no-store'}).then(r => r.ok ? r.json() : null).then(j => {
    if (!j || !j.name) return;
    ACCOUNT = j.name;
    $('#readerw').hidden = true; $('#who').hidden = false; $('#who').textContent = `Okuyucu: ${j.name}`;
  }).catch(() => {});
}
render();
loadServer();
</script>
</body></html>
