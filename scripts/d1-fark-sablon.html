<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fark Okuması</title>
<style>
:root { --bg: #fbfaf7; --fg: #1d1d1b; --muted: #6b6a66; --line: #dcd8cf; --card: #ffffff; --soft: #f3f1ec;
        --accent: #1f5c3f; --accent-soft: #e2efe7; --ai: #5a4a8a; --ai-soft: #eeebf7; --diff: #fbe38a; --diff-fg: #1d1d1b;
        --bad: #a3271f; --warn: #8a4b00; --warn-soft: #fdf0dc; --src: #1f4f7a; --src-soft: #e3eef8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161614; --fg: #e8e6e1; --muted: #9c9a94; --line: #34332f; --card: #1f1e1b; --soft: #26251f;
  --accent: #7cc49d; --accent-soft: #1c3127; --ai: #b9a8ee; --ai-soft: #2a2540; --diff: #6b5810; --diff-fg: #fff6d6;
  --bad: #f08a80; --warn: #f0b46a; --warn-soft: #3a2a14; --src: #8cc0ef; --src-soft: #18293a; } }
:root[data-theme="dark"] { --bg: #161614; --fg: #e8e6e1; --muted: #9c9a94; --line: #34332f; --card: #1f1e1b; --soft: #26251f;
  --accent: #7cc49d; --accent-soft: #1c3127; --ai: #b9a8ee; --ai-soft: #2a2540; --diff: #6b5810; --diff-fg: #fff6d6;
  --bad: #f08a80; --warn: #f0b46a; --warn-soft: #3a2a14; --src: #8cc0ef; --src-soft: #18293a; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 system-ui, "Noto Sans", sans-serif; }
button, select, input, textarea { font: inherit; font-size: .85rem; color: var(--fg); }
.ar { font-family: "Noto Naskh Arabic", "Amiri", "Scheherazade New", serif; direction: rtl; text-align: right;
      font-size: 1.2rem; line-height: 2; }
.muted { color: var(--muted); } .small { font-size: .8rem; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
         padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
header h1 { font-size: 1rem; margin: 0; }
header label { font-size: .8rem; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
input, textarea { padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 3px 10px; cursor: pointer;
       text-decoration: none; color: var(--fg); font-size: .85rem; }
.btn:disabled { opacity: .45; cursor: default; }
.spacer { flex: 1; } .msg { font-size: .8rem; color: var(--bad); }
main { max-width: 1400px; margin: 0 auto; padding: 12px 16px 80px; }
.intro { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; margin-bottom: 14px; }
.intro p, .intro li { font-size: .88rem; margin: 4px 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin: 0 0 18px; padding: 10px 14px; }
.card.done { border-color: var(--accent); }
.card h2 { font-size: .95rem; margin: 0 0 8px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.col { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--bg); min-width: 0; }
.col h3 { margin: 0 0 4px; font-size: .9rem; color: var(--ai); }
.col .tr { font-family: "Noto Serif", "DejaVu Serif", Georgia, serif; font-size: .95rem; border-top: 1px dashed var(--line);
           padding-top: 6px; margin-top: 6px; }
mark.d { background: var(--diff); color: var(--diff-fg); border-radius: 2px; }
body.nodiff mark.d { background: none; color: inherit; }
.ask { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.ask label { font-size: .88rem; display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
.ask textarea { width: 100%; min-height: 3.2em; }
.reveal { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; font-size: .88rem; }
.reveal .who { font-weight: 600; }
.box { border-radius: 8px; padding: 6px 10px; margin: 6px 0; }
.box.env { background: var(--warn-soft); }
.box.cr { background: var(--ai-soft); }
.box.isr { background: var(--src-soft); }
.tag { display: inline-block; font-size: .7rem; font-weight: 600; border-radius: 4px; padding: 0 6px; background: var(--soft);
       border: 1px solid var(--line); color: var(--muted); }
@media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
</style></head>
<body>
<header>
  <h1>Fark okuması</h1>
  <span class="small muted" id="sub"></span>
  <label id="readerw">Okuyucu <input id="reader" size="10" placeholder="adınız"></label>
  <span id="who" class="small muted" hidden></span>
  <label><input type="checkbox" id="diff" checked> farkları işaretle</label>
  <span class="spacer"></span>
  <span id="progress" class="small muted"></span>
  <button class="btn" id="export">Dışa aktar</button>
  <a class="btn" href="./">Âyet masası</a>
  <span class="msg" id="msg"></span>
</header>
<main>
  <div class="intro" id="intro"></div>
  <div id="cards"></div>
</main>
<script>
const DATA = {data};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};
const KEY = 'd1-fark';
let marks = store.get(KEY, {});
const base = `${DATA.unit}|${DATA.eski}-${DATA.yeni}|`;
let ACCOUNT = null;
function reader() { return ACCOUNT || $('#reader').value.trim(); }
function say(t) { $('#msg').textContent = t; setTimeout(() => { $('#msg').textContent = ''; }, 4000); }
function save(id, patch) {
  const k = base + id;
  marks[k] = Object.assign({}, marks[k] || {}, patch, {at: new Date().toISOString(), reader: reader()});
  if (!store.set(KEY, marks)) say('Tarayıcı işareti kaydedemedi; dışa aktarın.');
  progress();
}
const CHOICE = [['A', 'A daha iyi'], ['B', 'B daha iyi'], ['esit', 'Eşit'], ['emin_degilim', 'Emin değilim']];
const CONFLICT = [['gercek', 'Gerçek çelişki'], ['nakil', 'Farklı görüşün nakli (çelişki değil)'],
                  ['degil', 'Çelişki değil'], ['emin_degilim', 'Emin değilim']];

// kelime farkı: iki yanda öbüründe olmayan kelimeler işaretlenir (simetrik; hangisinin yeni olduğunu söylemez)
function words(t) { return t.split(/(\s+)/); }
function norm(w) { return w.replace(/[ً-ْٰـ«»"“”'(),.:;؛،!?؟\[\]﴿﴾]/g, ''); }
function diffPair(a, b) {
  const A = words(a), B = words(b);
  const ai = A.map((w, i) => [w, i]).filter(([w]) => w.trim()), bi = B.map((w, i) => [w, i]).filter(([w]) => w.trim());
  const n = ai.length, m = bi.length;
  const L = Array.from({length: n + 1}, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i][j] = norm(ai[i][0]) === norm(bi[j][0]) ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const keepA = new Set(), keepB = new Set();
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (norm(ai[i][0]) === norm(bi[j][0])) { keepA.add(ai[i][1]); keepB.add(bi[j][1]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++;
  }
  const out = (W, keep) => W.map((w, k) => !w.trim() || keep.has(k) ? esc(w) : `<mark class="d">${esc(w)}</mark>`).join('');
  return [out(A, keepA), out(B, keepB)];
}

function srcHtml(c) {                                  // paragrafların andığı kaynakların metni (D12.5 Tur 0)
  if (!(c.kaynak || []).length) return '';
  return `<details class="srcs"><summary class="small">Paragrafların andığı kaynaklar (${c.kaynak.length})</summary>` +
    c.kaynak.map(s => `<div class="box"><b>[${esc(s.n)}]</b> <span class="small">${esc(s.cite)}</span>
      <div class="${/[\u0600-\u06ff]/.test(s.text) ? 'ar' : 'small'}" dir="auto">${esc(s.text) || '<span class="muted">(metin bulunamadı)</span>'}</div></div>`).join('') + '</details>';
}
function cardHtml(c, idx) {
  const m = marks[base + c.id] || {};
  const left = c.left === 'eski' ? 0 : 1;               // A sütunu hangi taslak
  const order = [left, 1 - left];
  const [arA, arB] = diffPair(c.ar[order[0]] || '', c.ar[order[1]] || '');
  const [trA, trB] = diffPair(c.tr[order[0]] || '', c.tr[order[1]] || '');
  const col = (lab, ar, tr) => `<div class="col"><h3>${lab}</h3><div class="ar" dir="rtl">${ar || '<span class="muted">(yok)</span>'}</div>
    <div class="tr">${tr || '<span class="muted">(tercüme yok)</span>'}</div></div>`;
  const opts = CHOICE.map(([v, l]) => `<label><input type="radio" name="c-${idx}" value="${v}" data-card="${c.id}" data-f="choice"${m.choice === v ? ' checked' : ''}>${l}</label>`).join('');
  let rev = '';
  if (m.opened) {
    const name = i => i === 0 ? `taslak ${DATA.eski} (düzeltilmemiş)` : `taslak ${DATA.yeni} (düzeltilmiş)`;
    rev = `<div class="reveal"><div><span class="who">A</span> = ${name(order[0])} · <span class="who">B</span> = ${name(order[1])}</div>`;
    for (const e of c.envanter) {
      rev += `<div class="box env"><b>Envanter (İşârât'tan çıkarılmış nükte ${esc(e.id)})</b>: düzeltilmiş hâldeki bir iddia bu nükteyle çelişiyor.
        <div class="small">Taslağın iddiası (okuyucunun özeti): ${esc(e.iddia)}</div><div class="small">İşârât'ın nüktesi: ${esc(e.nukte)}</div></div>
        <div class="box isr"><div class="small muted">İşârât'ın bu yerdeki sözü</div><div class="ar" dir="rtl">${esc(e.isarat_ar)}</div>
        <div class="small">${esc(e.isarat_tr)}</div></div>`;
    }
    for (const r of c.elestirmen) rev += `<div class="box cr"><b>Kör eleştirmen</b>: ${esc(r)}</div>`;
    if (!c.envanter.length && !c.elestirmen.length) rev += `<div class="small muted">Bu yer için envanterin ve kör eleştirmenin ayrıca bir sözü yok.</div>`;
    if (c.envanter.length) {
      rev += `<div class="ask"><b class="small">Envanterin dediği çelişki:</b>` + CONFLICT.map(([v, l]) =>
        `<label><input type="radio" name="k-${idx}" value="${v}" data-card="${c.id}" data-f="conflict"${m.conflict === v ? ' checked' : ''}>${l}</label>`).join('')
        + `<textarea data-card="${c.id}" data-f="conflict_note" placeholder="İsterseniz kısa not">${esc(m.conflict_note || '')}</textarea></div>`;
    }
    rev += '</div>';
  }
  return `<div class="card${m.choice ? ' done' : ''}" id="card-${idx}">
    <h2>${idx + 1}. ${esc(c.sec_title)} <span class="tag">paragraf ${esc(c.id.split('/')[1])}</span></h2>
    <div class="cols">${col('A', arA, trA)}${col('B', arB, trB)}</div>${srcHtml(c)}
    <div class="ask"><b class="small">Hangisi daha iyi?</b>${opts}
      <textarea data-card="${c.id}" data-f="reason" placeholder="Kısa gerekçe (bir iki cümle)">${esc(m.reason || '')}</textarea>
      <button class="btn" data-open="${c.id}" ${m.choice ? '' : 'disabled'}>${m.opened ? 'Açıldı' : 'Aç: hangisi düzeltilmiş, ölçüler ne demiş'}</button>
    </div>${rev}</div>`;
}
function render() {
  $('#sub').textContent = `${DATA.title} · taslak ${DATA.eski} ile ${DATA.yeni} · ${DATA.cards.length} yer`;
  $('#intro').innerHTML = DATA.intro;
  $('#cards').innerHTML = DATA.cards.map(cardHtml).join('');
  progress();
}
function progress() {
  const n = DATA.cards.filter(c => (marks[base + c.id] || {}).choice).length;
  $('#progress').textContent = `İşaretlenen: ${n}/${DATA.cards.length}`;
}
document.addEventListener('change', ev => {
  const t = ev.target, id = t.dataset.card, f = t.dataset.f;
  if (!id || !f) return;
  if (!reader()) { say('Önce okuyucu adınızı yazın.'); t.checked = false; $('#reader').focus(); return; }
  save(id, {[f]: t.value});
  if (f === 'choice') {
    const card = t.closest('.card');
    card.classList.add('done');
    card.querySelector('[data-open]').disabled = false;
  }
});
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-open]');
  if (!b) return;
  const id = b.dataset.open;
  if (!(marks[base + id] || {}).choice) return;
  save(id, {opened: true});
  const idx = DATA.cards.findIndex(c => c.id === id);
  $(`#card-${idx}`).outerHTML = cardHtml(DATA.cards[idx], idx);
});
$('#diff').onchange = () => { document.body.classList.toggle('nodiff', !$('#diff').checked); store.set('d1-fark-diff', $('#diff').checked); };
$('#export').onclick = () => {
  const items = DATA.cards.map(c => {
    const m = marks[base + c.id] || {};
    const left = c.left === 'eski' ? DATA.eski : DATA.yeni, right = c.left === 'eski' ? DATA.yeni : DATA.eski;
    const pick = m.choice === 'A' ? left : m.choice === 'B' ? right : null;
    return {id: c.id, tur: c.tur, A: left, B: right, choice: m.choice || null, tercih_taslak: pick, reason: m.reason || '',
            conflict: m.conflict || null, conflict_note: m.conflict_note || '', opened: !!m.opened, at: m.at || null};
  });
  const out = {kind: 'd1-fark', unit: DATA.unit, eski: DATA.eski, yeni: DATA.yeni, reader: reader(),
               exported: new Date().toISOString(), items};
  const blob = new Blob([JSON.stringify(out, null, 1)], {type: 'application/json'});
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '');
  a.href = URL.createObjectURL(blob); a.download = `d1-fark-${DATA.unit}-${DATA.eski}-${DATA.yeni}-${reader() || 'okuyucu'}-${stamp}.json`;
  a.click(); URL.revokeObjectURL(a.href);
};
$('#reader').value = store.get('d1-okuma-okur', '') || '';
$('#reader').onchange = () => store.set('d1-okuma-okur', reader());
if (store.get('d1-fark-diff', true) === false) { $('#diff').checked = false; document.body.classList.add('nodiff'); }
if (location.protocol.startsWith('http')) {
  fetch('/ben', {credentials: 'same-origin', cache: 'no-store'}).then(r => r.ok ? r.json() : null).then(j => {
    if (!j || !j.name) return;
    ACCOUNT = j.name;
    $('#readerw').hidden = true; $('#who').hidden = false; $('#who').textContent = `Okuyucu: ${j.name}`;
  }).catch(() => {});
}
render();
</script>
</body></html>
