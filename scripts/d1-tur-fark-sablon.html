<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tur Fark Okuması</title>
<style>
:root { --bg: #fbfaf7; --fg: #1d1d1b; --muted: #6b6a66; --line: #dcd8cf; --card: #ffffff; --soft: #f3f1ec;
        --accent: #1f5c3f; --accent-soft: #e2efe7; --ai: #5a4a8a; --ai-soft: #eeebf7; --diff: #fbe38a; --diff-fg: #1d1d1b;
        --bad: #a3271f; --src: #1f4f7a; --src-soft: #e3eef8; --q: #f6f2e8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161614; --fg: #e8e6e1; --muted: #9c9a94; --line: #34332f; --card: #1f1e1b; --soft: #26251f;
  --accent: #7cc49d; --accent-soft: #1c3127; --ai: #b9a8ee; --ai-soft: #2a2540; --diff: #6b5810; --diff-fg: #fff6d6;
  --bad: #f08a80; --src: #8cc0ef; --src-soft: #18293a; --q: #24221c; } }
:root[data-theme="dark"] { --bg: #161614; --fg: #e8e6e1; --muted: #9c9a94; --line: #34332f; --card: #1f1e1b; --soft: #26251f;
  --accent: #7cc49d; --accent-soft: #1c3127; --ai: #b9a8ee; --ai-soft: #2a2540; --diff: #6b5810; --diff-fg: #fff6d6;
  --bad: #f08a80; --src: #8cc0ef; --src-soft: #18293a; --q: #24221c; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 system-ui, "Noto Sans", sans-serif; }
button, select, input, textarea { font: inherit; font-size: .85rem; color: var(--fg); }
.ar { font-family: "Noto Naskh Arabic", "Amiri", "Scheherazade New", serif; direction: rtl; text-align: right;
      font-size: 1.2rem; line-height: 2; }
.serif { font-family: "Noto Serif", "DejaVu Serif", Georgia, serif; font-size: .95rem; }
.muted { color: var(--muted); } .small { font-size: .8rem; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
         padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
header h1 { font-size: 1rem; margin: 0; }
header label { font-size: .8rem; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
input, textarea, select { padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 3px 10px; cursor: pointer;
       text-decoration: none; color: var(--fg); font-size: .85rem; }
.btn:disabled { opacity: .45; cursor: default; }
.spacer { flex: 1; } .msg { font-size: .8rem; color: var(--bad); }
main { max-width: 1500px; margin: 0 auto; padding: 12px 16px 80px; }
.intro { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; margin-bottom: 14px; font-size: .88rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin: 0 0 22px; padding: 10px 14px; }
.card.done { border-color: var(--accent); }
.card h2 { font-size: 1rem; margin: 0 0 2px; }
.card .soru { font-size: .88rem; color: var(--muted); margin: 0 0 10px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.col { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--bg); min-width: 0; }
.col > h3 { margin: 0 0 4px; font-size: .95rem; color: var(--ai); position: sticky; top: 48px; background: var(--bg); padding: 2px 0; z-index: 1; }
.blk { border-top: 1px dashed var(--line); padding: 6px 0; }
.blk:first-of-type { border-top: 0; }
.blk.quote { background: var(--q); border-left: 3px solid var(--line); padding: 4px 8px; margin: 4px 0; border-top: 0; border-radius: 4px; }
.blk .lab { font-size: .72rem; color: var(--muted); }
.blk .serif { margin-top: 4px; }
.only-tr .blk .ar, .only-ar .blk .serif { display: none; }
.only-tr .blk .ar.keep { display: block; }
mark.d { background: var(--diff); color: var(--diff-fg); border-radius: 2px; }
body.nodiff mark.d { background: none; color: inherit; }
.arw { font-family: "Noto Naskh Arabic", "Amiri", "Scheherazade New", serif; font-size: 1.1em; }
.mk { color: var(--src); font-size: .8em; cursor: help; }
.ask { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.ask label { font-size: .88rem; display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
.ask textarea { width: 100%; min-height: 3.2em; }
.reveal { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; font-size: .88rem; }
.box { border-radius: 8px; padding: 6px 10px; margin: 6px 0; background: var(--src-soft); }
details.srcs { margin-top: 8px; }
details.srcs .box .ar { font-size: 1.05rem; }
.stat { font-size: .75rem; color: var(--muted); font-weight: normal; }
@media (max-width: 820px) { .cols { grid-template-columns: 1fr; } .col > h3 { position: static; } }
</style></head>
<body>
<header>
  <h1>Tur fark okuması</h1>
  <span class="small muted" id="sub"></span>
  <label id="readerw">Okuyucu <input id="reader" size="10" placeholder="adınız"></label>
  <span id="who" class="small muted" hidden></span>
  <label>Fark <select id="mode">
    <option value="kok">öbür yanda geçmeyen kelimeler (ekler gözetilmeden)</option>
    <option value="kume">öbür yanda geçmeyen kelimeler (aynı yazılış)</option>
    <option value="yok">işaretleme</option></select></label>
  <label>Dil <select id="lang">
    <option value="iki">Arapça ve Türkçe</option>
    <option value="tr">yalnız Türkçe</option>
    <option value="ar">yalnız Arapça</option></select></label>
  <span class="spacer"></span>
  <span id="progress" class="small muted"></span>
  <button class="btn" id="export">Dışa aktar</button>
  <a class="btn" id="masa" href="./">Âyet masası</a>
  <span class="msg" id="msg"></span>
</header>
<main>
  <div class="intro" id="intro"></div>
  <div id="cards"></div>
</main>
<script>
const DATA = {data};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};
// işaretler masanın tur kutusuyla ortak: "birim|tur|yer" -> {secim: taslak|esit|emin_degilim, harf, gerekce, acildi}
const KEY = 'd1-masa-ab';
let marks = store.get(KEY, {});
const kOf = c => `${DATA.unit}|${DATA.tur}|${c.id}`;
let ACCOUNT = null;
function reader() { return ACCOUNT || $('#reader').value.trim(); }
function say(t) { $('#msg').textContent = t; setTimeout(() => { $('#msg').textContent = ''; }, 4000); }
function save(c, patch) {
  marks = store.get(KEY, {});                          // masa başka sekmede açıksa onun işaretleri ezilmesin
  const k = kOf(c);
  marks[k] = Object.assign({}, marks[k] || {}, patch, {at: new Date().toISOString(), reader: reader()});
  if (!store.set(KEY, marks)) say('Tarayıcı işareti kaydedemedi; dışa aktarın.');
  progress();
}
const CHOICE = [['a', 'A daha iyi'], ['b', 'B daha iyi'], ['esit', 'Eşit'], ['emin_degilim', 'Emin değilim']];
const val = v => v === 'a' ? DATA.a : v === 'b' ? DATA.b : v;

// --- kelime farkı: iki taslak ayrı yazıldığı için sıra gözetilmez; bir yanın o yerinde olup öbür yanın o yerinde hiç
// geçmeyen kelime işaretlenir. "kok": Arapçada baştaki و ف, harf-i cer ve ال, sondaki zamir ve çoğul eki; Türkçede
// kelimenin ilk beş harfi (ekler) gözetilmez. "kume": yalnız hareke, şapka ve noktalama gözetilmez.
const AR = /[؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿]/;
function norm(w) {
  if (/^\[[^\]]*\]$/.test(w)) return '';                // kaynak numarası
  if (AR.test(w)) return w.replace(/[ً-ٰٟۖ-ۭـ]/g, '').replace(/[أإآٱ]/g, 'ا')
    .replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي').replace(/[^ء-ي]/g, '');
  return w.toLocaleLowerCase('tr').split(/['’‘]/)[0].normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/ı/g, 'i').replace(/[^a-z0-9ğüşöç]/g, '');
}
function root(n) {
  if (!/[ء-ي]/.test(n)) return n.slice(0, 5);
  let s = n.replace(/ء/g, '').replace(/^[وف](?=...)/, '').replace(/^[بلك](?=ال)/, '').replace(/^ال(?=...)/, '');
  for (const re of [/(هما|هم|ها|ه|ي)$/, /(ات|ون|ين|ان)$/]) { const m = s.match(re); if (m && s.length - m[0].length >= 3) s = s.slice(0, -m[0].length); }
  return s;
}
const split = t => t.split(/(\s+)/);
function sideTokens(s, mode) {                         // parçalar (blok × dil) ve düz kelime listesi
  const parts = [], flat = [];
  s.blocks.forEach((b, i) => {
    for (const f of ['ar', 'tr']) {
      const W = split(b[f] || ''); parts.push({i, f, W});
      W.forEach((w, k) => { let n = w.trim() ? norm(w) : ''; if (n && mode === 'kok') n = root(n); if (n) flat.push({p: parts.length - 1, k, n}); });
    }
  });
  return {parts, flat};
}
function marksFor(A, B, mode) {                        // her yan için işaretlenecek "parça:kelime" kümesi
  const mA = new Set(), mB = new Set();
  if (mode === 'yok') return [mA, mB];
  const sa = new Set(A.flat.map(x => x.n)), sb = new Set(B.flat.map(x => x.n));
  A.flat.forEach(x => { if (!sb.has(x.n)) mA.add(x.p + ':' + x.k); });
  B.flat.forEach(x => { if (!sa.has(x.n)) mB.add(x.p + ':' + x.k); });
  return [mA, mB];
}
function renderWords(W, p, mk, srcs, tr) {
  const one = (w, k) => {
    let h = esc(w);
    const ref = w.match(/^\[([^\]]+)\]([.,:;]*)$/);
    if (ref) {
      const title = (ref[1].match(/\d+/g) || []).map(n => `[${n}] ${srcs[n] ? srcs[n].c : ''}`).join(' | ');
      h = `<span class="mk" title="${esc(title)}">${esc(w)}</span>`;
    }
    return mk.has(p + ':' + k) ? `<mark class="d">${h}</mark>` : h;
  };
  const isAr = w => AR.test(w) && !/[A-Za-zÇĞİÖŞÜçğıöşüâîû]/.test(w);
  let out = '', run = null;                            // Türkçede Arapça ibare sağdan sola tek öbek (masadaki gibi)
  const flush = () => { if (run) { out += `<bdi class="arw" dir="rtl">${run.trim()}</bdi>` + (/\s$/.test(run) ? ' ' : ''); run = null; } };
  W.forEach((w, k) => {
    if (!w.trim()) {
      if (w.includes('\n')) { flush(); out += '<br>'; }
      else if (run !== null) run += w; else out += w;
      return;
    }
    if (tr && isAr(w)) {                               // baştaki ve sondaki ayraç, nokta öbeğin dışında kalır
      const m = w.match(/^([^\u0600-\u06ff\ufb50-\ufdff\ufe70-\ufeff]*)(.*?)([^\u0600-\u06ff\ufb50-\ufdff\ufe70-\ufeff]*)$/s);
      const wrap = t => mk.has(p + ':' + k) ? `<mark class="d">${esc(t)}</mark>` : esc(t);
      if (m[1]) { flush(); out += wrap(m[1]); }
      run = (run || '') + wrap(m[2]);
      if (m[3]) { flush(); out += wrap(m[3]); }
      return;
    }
    flush(); out += one(w, k);
  });
  flush();
  return out;
}
const SEC = {Âyet: 'Âyet', Mukaddime: 'Mukaddime', V1: 'Birinci vecih', V2: 'İkinci vecih', V3: 'Üçüncü vecih'};
function colHtml(lab, s, T, mk) {
  if (!s.blocks.length) return `<div class="col"><h3>${lab}</h3><p class="muted small">Bu taslakta bu yere bağlı paragraf yok.</p></div>`;
  const html = s.blocks.map((b, i) => {
    const pAr = T.parts.findIndex(x => x.i === i && x.f === 'ar'), pTr = T.parts.findIndex(x => x.i === i && x.f === 'tr');
    const ar = renderWords(T.parts[pAr].W, pAr, mk, s.sources, false), tr = b.tr ? renderWords(T.parts[pTr].W, pTr, mk, s.sources, true) : '';
    return `<div class="blk${b.q ? ' quote' : ''}"><div class="lab">${esc(SEC[b.a.split('/')[0]] || '')}${b.q ? ' · kaynaktan alıntı' : ''}</div>
      <div class="ar${tr ? '' : ' keep'}" dir="rtl">${ar}</div>${tr ? `<div class="serif">${tr}</div>` : ''}</div>`;
  }).join('');
  const srcs = Object.entries(s.sources);
  const sh = srcs.length ? `<details class="srcs"><summary class="small">${lab}'nın bu yerde andığı kaynaklar (${srcs.length})</summary>` +
    srcs.map(([n, x]) => `<div class="box"><b>[${esc(n)}]</b> <span class="small">${esc(x.c)}</span>
      <div class="${AR.test(x.t) ? 'ar' : 'small'}" dir="auto">${esc(x.t) || '<span class="muted">(metin bulunamadı)</span>'}</div></div>`).join('') + '</details>' : '';
  const nw = T.flat.length, nm = mk.size;
  return `<div class="col"><h3>${lab} <span class="stat">${s.blocks.length} paragraf · ${nw} kelime${nm ? ` · ${nm} sarı` : ''}</span></h3>${html}${sh}</div>`;
}
function cardHtml(c, idx) {
  const m = marks[kOf(c)] || {};
  const mode = $('#mode').value, TA = sideTokens(c.A, mode), TB = sideTokens(c.B, mode);
  const [mA, mB] = marksFor(TA, TB, mode);
  const opts = CHOICE.map(([v, l]) => `<label><input type="radio" name="c-${idx}" value="${esc(val(v))}" data-i="${idx}" data-f="secim"${m.secim === val(v) ? ' checked' : ''}>${l}</label>`).join('');
  const who = d => `${esc(d)} (${esc(DATA.about[d] || '')})`;
  const rev = m.acildi ? `<div class="reveal"><div><b>A</b> = ${who(DATA.a)}</div><div><b>B</b> = ${who(DATA.b)}</div>
      ${c.acik ? `<div class="box">${esc(c.acik)}</div>` : ''}</div>` : '';
  return `<div class="card${m.secim ? ' done' : ''}" id="card-${idx}">
    <h2>${idx + 1}. ${esc(c.baslik)}</h2><p class="soru">${esc(c.soru || '')}</p>
    <div class="cols">${colHtml('A', c.A, TA, mA)}${colHtml('B', c.B, TB, mB)}</div>
    <div class="ask"><b class="small">Hangisi daha iyi?</b>${opts}
      <textarea data-i="${idx}" data-f="gerekce" placeholder="Kısa gerekçe (bir iki cümle)">${esc(m.gerekce || '')}</textarea>
      ${m.acildi ? '' : `<button class="btn" data-open="${idx}" ${m.secim ? '' : 'disabled'}>Aç: hangisi hangisi, ölçüler ne demiş</button>`}
    </div>${rev}</div>`;
}
function render() {
  $('#sub').textContent = `${DATA.title} · ${DATA.tur} · ${DATA.cards.length} yer`;
  $('#intro').innerHTML = DATA.giris;
  $('#cards').innerHTML = DATA.cards.map(cardHtml).join('');
  progress();
}
function progress() {
  const n = DATA.cards.filter(c => (marks[kOf(c)] || {}).secim).length;
  $('#progress').textContent = `İşaretlenen: ${n}/${DATA.cards.length}`;
}
function rerender(idx) { $(`#card-${idx}`).outerHTML = cardHtml(DATA.cards[idx], idx); }
document.addEventListener('change', ev => {
  const t = ev.target, f = t.dataset.f;
  if (!f) return;
  const c = DATA.cards[+t.dataset.i];
  if (!reader()) { say('Önce okuyucu adınızı yazın.'); if (t.type === 'radio') t.checked = false; $('#reader').focus(); return; }
  if (f === 'secim') {
    const harf = t.value === DATA.a ? 'A' : t.value === DATA.b ? 'B' : t.value;
    save(c, {secim: t.value, harf});
    const card = t.closest('.card'); card.classList.add('done');
    const b = card.querySelector('[data-open]'); if (b) b.disabled = false;
  } else save(c, {gerekce: t.value});
});
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-open]');
  if (!b) return;
  const idx = +b.dataset.open, c = DATA.cards[idx];
  if (!(marks[kOf(c)] || {}).secim) return;
  save(c, {acildi: new Date().toISOString()});
  rerender(idx);
});
$('#mode').onchange = () => { store.set('d1-tur-fark-mod', $('#mode').value); document.body.classList.toggle('nodiff', $('#mode').value === 'yok'); render(); };
$('#lang').onchange = () => { store.set('d1-tur-fark-dil', $('#lang').value); applyLang(); };
function applyLang() { const v = $('#lang').value; document.body.classList.toggle('only-tr', v === 'tr'); document.body.classList.toggle('only-ar', v === 'ar'); }
$('#export').onclick = () => {
  const ab = Object.fromEntries(DATA.cards.map(c => [kOf(c), marks[kOf(c)]]).filter(([, v]) => v));
  const out = {kind: 'd1-tur-fark', unit: DATA.unit, tur: DATA.tur, a: DATA.a, b: DATA.b, reader: reader(),
               exported: new Date().toISOString(), ab};
  const blob = new Blob([JSON.stringify(out, null, 1)], {type: 'application/json'});
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '');
  a.href = URL.createObjectURL(blob); a.download = `d1-tur-${DATA.unit}-${DATA.tur}-${reader() || 'okuyucu'}-${stamp}.json`;
  a.click(); URL.revokeObjectURL(a.href);
};
$('#masa').href = DATA.masa;
$('#reader').value = store.get('d1-okuma-okur', '') || '';
$('#reader').onchange = () => store.set('d1-okuma-okur', reader());
$('#mode').value = store.get('d1-tur-fark-mod', 'kok');
if (!$('#mode').value) $('#mode').value = 'kok';
$('#lang').value = store.get('d1-tur-fark-dil', 'iki');
document.body.classList.toggle('nodiff', $('#mode').value === 'yok');
applyLang();
window.addEventListener('storage', ev => { if (ev.key === KEY) { marks = store.get(KEY, {}); render(); } });
if (location.protocol.startsWith('http')) {
  fetch('/taslak/ben', {credentials: 'same-origin', cache: 'no-store'}).then(r => r.ok ? r.json() : null).then(j => {
    if (!j || !j.name) return;
    ACCOUNT = j.name;
    $('#readerw').hidden = true; $('#who').hidden = false; $('#who').textContent = `Okuyucu: ${j.name}`;
  }).catch(() => {});
}
render();
</script>
</body></html>
